<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081b17"><title>Inviteora | Normal Collection</title>
<style>
:root{--bg:#081b17;--panel:#102b25;--gold:#d4b477;--cream:#fff5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:Georgia,serif}.top{padding:30px 18px 24px;text-align:center;background:radial-gradient(ellipse at top,#315849,#0b211c 70%);border-bottom:1px solid #c9a76566}.brand{letter-spacing:5px;color:var(--gold);font:12px Arial}.top h1{font-size:34px;font-weight:400;margin:14px 0 8px}.top p{font:13px/1.7 Arial;color:#d7d1c3;max-width:540px;margin:auto}.tools{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:20px}.tools button,.tools select{background:#102b25;color:var(--cream);border:1px solid #c9a76588;padding:10px 14px;border-radius:24px}.wrap{max-width:1100px;margin:auto;padding:22px 15px 50px}.section-title{color:var(--gold);font:12px Arial;letter-spacing:3px;margin:24px 0 14px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.tile{border:1px solid #c9a76555;border-radius:13px;overflow:hidden;background:#102b25}.art{height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;position:relative;isolation:isolate;overflow:hidden}.art:before{content:"";position:absolute;inset:9px;border:1px solid currentColor;opacity:.65;z-index:-1}.art:after{content:"✦ ❧ ✦";position:absolute;bottom:15px;left:0;right:0;font-size:15px;opacity:.8}.art .mini{font:9px Arial;letter-spacing:2px;margin-bottom:14px}.art .event{font-size:25px;line-height:1.15}.art .names{font-size:15px;margin-top:12px}.art .orn{font-size:28px;margin:10px}.meta{padding:12px}.meta strong{display:block;font-size:15px;font-weight:400}.meta small{display:block;color:#c8c0ae;font:11px Arial;margin:6px 0 11px}.meta button{width:100%;background:transparent;border:1px solid #c9a76588;color:var(--gold);padding:9px;border-radius:20px}.emerald{background:radial-gradient(ellipse,#245a49,#08271f 75%);color:#e6ca88}.navy{background:radial-gradient(ellipse,#233b67,#0a142a 78%);color:#e4c77d}.maroon{background:radial-gradient(ellipse,#713342,#2c101b 78%);color:#f0d19a}.ivory{background:radial-gradient(ellipse,#fff4dc,#c9b58f 85%);color:#704d2b}.rose{background:radial-gradient(ellipse,#f4cbd3,#6d3349 85%);color:#fff0df}.blackgold{background:radial-gradient(ellipse,#34312a,#090909 78%);color:#e2c17c}.blue{background:radial-gradient(ellipse,#397c9b,#102f49 78%);color:#f5dfad}.purple{background:radial-gradient(ellipse,#5a3d80,#21152f 78%);color:#e9d4ff}.preview{display:none;position:fixed;inset:0;background:#000e;z-index:5;padding:16px;overflow:auto}.preview.show{display:grid;place-items:center}.modal{width:min(100%,430px);min-height:80vh;border:1px solid var(--gold);padding:24px 18px;background:radial-gradient(ellipse,#234f43,#081b17 75%);text-align:center;position:relative}.slide{display:none;min-height:65vh;flex-direction:column;justify-content:center;align-items:center;gap:15px}.slide.active{display:flex;animation:fade .55s ease}.slide .kicker{font:10px Arial;letter-spacing:3px;color:var(--gold)}.slide h2{font-size:34px;font-weight:400;margin:4px}.slide p{font:14px/1.8 Arial;max-width:300px}.slide .big{font-size:28px;color:var(--gold)}.nav{display:flex;justify-content:center;gap:10px;align-items:center}.nav button{border:1px solid var(--gold);background:#0b2923;color:var(--cream);padding:9px 15px;border-radius:20px}.close{position:absolute;right:12px;top:10px;background:none;border:1px solid var(--gold);color:var(--cream);border-radius:20px;padding:7px 11px}@keyframes fade{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}[dir=rtl] .top p{letter-spacing:0}
</style></head><body>
<header class="top"><div class="brand">INVITEORA</div><h1 data-en="Normal Invitation Collection" data-ur="نارمل دعوت ناموں کا مجموعہ">Normal Invitation Collection</h1><p data-en="Simple, elegant and mobile-friendly invitations. Choose an event and a colour, then preview the bilingual slideshow." data-ur="سادہ، خوب صورت اور موبائل کے لیے موزوں دعوت نامے۔ تقریب اور رنگ منتخب کریں، پھر اردو اور انگلش سلائیڈ شو دیکھیں۔">Simple, elegant and mobile-friendly invitations. Choose an event and a colour, then preview the bilingual slideshow.</p><div class="tools"><button id="language">اردو</button><select id="eventFilter"><option value="all">All events</option><option>Wedding</option><option>Mehndi</option><option>Barat</option><option>Walima</option><option>Engagement</option><option>Birthday</option><option>Anniversary</option><option>Baby Shower</option><option>Aqeeqah</option><option>Graduation</option></select></div></header>
<main class="wrap"><div class="section-title" data-en="Wedding colour themes" data-ur="شادی کے رنگ">Wedding colour themes</div><div class="grid" id="weddings"></div><div class="section-title" data-en="Other celebrations" data-ur="دیگر تقریبات">Other celebrations</div><div class="grid" id="events"></div></main>
<div class="preview" id="preview"><section class="modal"><button class="close" id="close">✕</button><div id="slides"></div><div class="nav"><button id="prev">‹</button><span id="count">1 / 5</span><button id="next">›</button></div></section></div>
<script>
const themes=[['emerald','Emerald Green & Gold','زمردی سبز اور گولڈ'],['navy','Royal Navy & Gold','رائل نیوی اور گولڈ'],['maroon','Maroon & Antique Gold','میرون اور اینٹیک گولڈ'],['ivory','Ivory & Champagne','آئیوری اور شیمپین'],['rose','Rose Pink','روز پنک'],['blackgold','Black & Gold','بلیک اور گولڈ']];
const weddings=['Wedding','Mehndi','Barat','Walima','Engagement'];
const other=['Birthday','Anniversary','Baby Shower','Aqeeqah','Graduation'];
let ur=false,current=0,slidesData=[];
const tr=(en,ur)=>ur?ur:en;
function card(event,theme,i){let [cls,name,urName]=theme;let evUr={Wedding:'شادی',Mehndi:'مہندی',Barat:'بارات',Walima:'ولیمہ',Engagement:'منگنی',Birthday:'سالگرہ',Anniversary:'سالگرہ', 'Baby Shower':'گود بھرائی',Aqeeqah:'عقیقہ',Graduation:'گریجویشن'}[event]||event;return '<article class="tile" data-event="'+event+'"><div class="art '+cls+'"><div class="mini">INVITEORA</div><div class="orn">✦</div><div class="event">'+(ur?evUr:event)+'</div><div class="names">'+(event==='Wedding'?'Ayesha & Ahmed':event==='Birthday'?'Happy Birthday':'A Special Celebration')+'</div></div><div class="meta"><strong>'+(ur?evUr:event)+'</strong><small>'+(ur?urName:name)+'</small><button onclick="openPreview(\''+event+'\',\''+cls+'\')">'+(ur?'پریویو دیکھیں':'Preview design')+'</button></div></article>'}
function render(){document.getElementById('weddings').innerHTML=weddings.map((e,i)=>card(e,themes[i%themes.length],i)).join('')+themes.slice(1).map((t,i)=>card('Wedding',t,i+1)).join('');document.getElementById('events').innerHTML=other.map((e,i)=>card(e,themes[(i+2)%themes.length],i)).join('');filter()}
function filter(){let v=document.getElementById('eventFilter').value;document.querySelectorAll('.tile').forEach(x=>x.style.display=v==='all'||x.dataset.event===v?'':'none')}
function openPreview(event,theme){let evUr={Wedding:'شادی',Mehndi:'مہندی',Barat:'بارات',Walima:'ولیمہ',Engagement:'منگنی',Birthday:'سالگرہ',Anniversary:'سالگرہ', 'Baby Shower':'گود بھرائی',Aqeeqah:'عقیقہ',Graduation:'گریجویشن'}[event]||event;let title=ur?evUr:event;slidesData=[{k:ur?'بسم اللہ الرحمن الرحیم':'BISMILLAH',h:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ',p:ur?'اللہ کے فضل و کرم سے آپ کو تقریب میں شرکت کی دعوت دیتے ہیں۔':'With the blessings of Allah, we warmly invite you to join our celebration.'},{k:ur?'خاندان کی خوشی':'A FAMILY CELEBRATION',h:event==='Wedding'?'Ayesha & Ahmed':event==='Birthday'?'Happy Birthday':'A Special Celebration',p:ur?'والدین: جناب اور محترمہ — یہاں والدین کے نام درج ہوں گے۔':'Parents: Mr. & Mrs. — parents’ names can be added here.'},{k:ur?'تاریخ اور وقت':'DATE & TIME',h:ur?'ہفتہ، 20 دسمبر 2026':'Saturday, 20 December 2026',p:ur?'شام 7:30 بجے':'7:30 PM onwards'},{k:ur?'مقام':'VENUE',h:ur?'رائل گارڈن مارکی، کراچی':'Royal Garden Marquee, Karachi',p:ur?'گوگل میپس پر راستہ دیکھیں':'Open the location in Google Maps'},{k:ur?'میزبان اور دعا':'HOSTS & PRAYER',h:ur?'آپ کی آمد ہمارے لیے باعثِ مسرت ہوگی':'Your presence will make our day memorable',p:ur?'میزبان: خاندانِ احمد و عائشہ۔ اللہ اس خوشی میں برکت عطا فرمائے۔':'Hosts: The Ahmed and Ayesha families. May Allah bless this celebration.'}];current=0;showSlide();document.getElementById('preview').classList.add('show');}
function showSlide(){let d=slidesData[current];document.getElementById('slides').innerHTML='<div class="slide active"><div class="kicker">'+d.k+'</div><div class="big">✦</div><h2>'+d.h+'</h2><p>'+d.p+'</p></div>';document.getElementById('count').textContent=(current+1)+' / '+slidesData.length}
document.getElementById('next').onclick=()=>{current=(current+1)%slidesData.length;showSlide()};document.getElementById('prev').onclick=()=>{current=(current+slidesData.length-1)%slidesData.length;showSlide()};document.getElementById('close').onclick=()=>document.getElementById('preview').classList.remove('show');document.getElementById('eventFilter').onchange=filter;
document.getElementById('language').onclick=()=>{ur=!ur;document.documentElement.lang=ur?'ur':'en';document.documentElement.dir=ur?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(x=>x.textContent=ur?x.dataset.ur:x.dataset.en);document.getElementById('language').textContent=ur?'English':'اردو';render()};render();
</script></body></html>
