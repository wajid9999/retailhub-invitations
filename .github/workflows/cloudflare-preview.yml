# Re-run preview deployment after Cloudflare repository secrets are configured.
name: Deploy Inviteora Cloudflare Preview

on:
  push:
    branches: [cloudflare-preview-vip]
    paths:
      - 'retailhub-invitations.zip'
      - 'site/**'
      - 'tests/**'
      - 'supabase/**'
      - '.github/workflows/cloudflare-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inviteora-cloudflare-preview
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Extract the same source package used by GitHub Pages
        run: |
          if [ -f retailhub-invitations.zip ]; then ZIP_PATH=retailhub-invitations.zip; else ZIP_PATH=site.zip; fi
          test -f "$ZIP_PATH"
          mkdir -p public
          unzip -q "$ZIP_PATH" -d extracted
          test -f extracted/site/index.html
          cp -R extracted/site/. public/
          if [ -f site/index.html ]; then cp site/index.html public/index.html; fi
          if [ -f site/admin.html ]; then cp site/admin.html public/admin.html; fi
          if [ -f site/templates/velvet-curtain/index.html ]; then
            mkdir -p public/templates/velvet-curtain
            cp site/templates/velvet-curtain/index.html public/templates/velvet-curtain/index.html
          fi

      - name: Load the four-scene VIP package from its published release asset
        run: |
          set -e
          ASSET_URL="https://github.com/wajid9999/retailhub-invitations/releases/download/inviteora-vip-royal-mughal-v1/Inviteora-Royal-Mughal-Palace-VIP-Cloudflare-Assets.zip"
          if curl --fail --location --silent --show-error --retry 2 "$ASSET_URL" -o /tmp/inviteora-vip-assets.zip; then
            mkdir -p /tmp/inviteora-vip-assets site/new-templates/vip-royal-mughal-palace
            unzip -q -o /tmp/inviteora-vip-assets.zip -d /tmp/inviteora-vip-assets
            cp -R /tmp/inviteora-vip-assets/Inviteora-Royal-Mughal-Palace-VIP-Cloudflare-Assets/. site/new-templates/vip-royal-mughal-palace/
            test -f site/new-templates/vip-royal-mughal-palace/template.html
            test -f site/new-templates/vip-royal-mughal-palace/template.json
            test -f site/new-templates/vip-royal-mughal-palace/media/Royal-Palace-Opening.mp4
            test -f site/new-templates/vip-royal-mughal-palace/media/Royal-Mehndi.mp4
            test -f site/new-templates/vip-royal-mughal-palace/media/Royal-Baraat-Arrival.mp4
            test -f site/new-templates/vip-royal-mughal-palace/media/Royal-Walima.mp4
            echo "Four-scene VIP template package loaded."
          else
            echo "VIP release asset is not published yet; keeping the incomplete package out of the gallery."
          fi

      - name: Build gallery template packages and extract media
        run: |
          python3 - <<'PY'
          import base64, json, re, shutil
          from pathlib import Path

          source = Path("site/new-templates")
          public = Path("public")
          registry = public / "templates.json"
          if source.exists():
            data = json.loads(registry.read_text(encoding="utf-8"))
            items = data.setdefault("templates", [])
            known = {str(x.get("id")) for x in items}
            for folder in sorted(p for p in source.iterdir() if p.is_dir()):
              meta_path, html_path = folder / "template.json", folder / "template.html"
              if not meta_path.is_file() or not html_path.is_file():
                raise SystemExit(f"Incomplete template package: {folder}")
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              template_id = str(meta.get("id", "")).strip()
              if not template_id or template_id in known:
                raise SystemExit(f"Missing or duplicate template id: {template_id}")
              thumb_src = next((folder / ("thumbnail" + ext) for ext in (".svg", ".png", ".jpg", ".webp") if (folder / ("thumbnail" + ext)).is_file()), None)
              if thumb_src is None:
                # VIP cinematic package stores its poster frames under media/thumbnails.
                candidate = folder / "media" / "thumbnails" / "Royal-Palace-Opening.jpg"
                if candidate.is_file():
                  thumb_src = candidate
              if thumb_src is None:
                raise SystemExit(f"Missing thumbnail in {folder}")
              html_rel, thumb_rel = f"templates/{template_id}.html", f"thumbs/{template_id}{thumb_src.suffix.lower()}"
              (public / "templates").mkdir(parents=True, exist_ok=True)
              (public / "thumbs").mkdir(parents=True, exist_ok=True)
              html_text = html_path.read_text(encoding="utf-8")
              asset_dir = public / "templates" / template_id / "media"
              asset_dir.mkdir(parents=True, exist_ok=True)
              asset_counts = {}
              def externalize(match):
                mime, encoded = match.group(1), match.group(2)
                ext = "mp4" if mime == "video/mp4" else ("png" if mime == "image/png" else "jpg")
                asset_counts[ext] = asset_counts.get(ext, 0) + 1
                filename = f"asset-{asset_counts[ext]:02d}.{ext}"
                (asset_dir / filename).write_bytes(base64.b64decode(encoded))
                return f"{template_id}/media/{filename}"
              html_text = re.sub(r"data:(image/jpeg|image/png|video/mp4);base64,([A-Za-z0-9+/=]+)", externalize, html_text)
              supplied_media = folder / "media"
              if supplied_media.is_dir():
                shutil.copytree(supplied_media, asset_dir, dirs_exist_ok=True)
              (public / html_rel).write_text(html_text, encoding="utf-8")
              shutil.copy2(thumb_src, public / thumb_rel)
              record = dict(meta)
              record["file"], record["thumb"] = html_rel, thumb_rel
              items.append(record)
              known.add(template_id)
            registry.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
            print("Built templates:", [x.get("id") for x in items])
          PY

      - name: Register Velvet Curtain in the editor catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("public/templates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          items = data.setdefault("templates", [])
          record = {
            "id": "velvet-curtain",
            "name": "Velvet Curtain — High Premium Video Invitation",
            "tag": "Animated velvet curtains and cinematic wedding reveal",
            "tier": "high", "occasion": "wedding", "ad": "velvet", "fam": True,
            "file": "templates/velvet-curtain/index.html",
            "thumb": "https://cdn.shopify.com/s/files/1/1021/1550/8503/files/velvet-curtain-thumbnail.jpg?v=1794508817"
          }
          existing = next((x for x in items if x.get("id") == "velvet-curtain"), None)
          if existing is None: items.append(record)
          else: existing.update(record)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Fix VIP cinematic template relative asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/templates/vip-royal-mughal-palace.html")
          if not p.is_file():
            raise SystemExit("VIP cinematic template is missing.")
          s = p.read_text(encoding="utf-8")
          # The gallery serves the HTML at /templates/<id>.html while package media
          # is stored at /templates/<id>/media. Resolve the package's relative URLs.
          s = s.replace('src="js/', 'src="vip-royal-mughal-palace/media/js/')
          s = s.replace('href="css/', 'href="vip-royal-mughal-palace/media/css/')
          s = s.replace('src="media/', 'src="vip-royal-mughal-palace/media/')
          s = s.replace('poster="media/', 'poster="vip-royal-mughal-palace/media/')
          s = s.replace('url(media/', 'url(vip-royal-mughal-palace/media/')
          p.write_text(s, encoding="utf-8")
          print("VIP cinematic media, poster and script paths now resolve from the gallery route.")
          PY

      - name: Fix VIP invitation URL payload decoding for browser-safe base64url
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/templates/vip-royal-mughal-palace.html")
          if not p.is_file():
            raise SystemExit("VIP Royal Mughal template was not generated.")
          s = p.read_text(encoding="utf-8")
          old = "function decodePayload(){try{var h=location.hash.slice(1);if(!h)return null;return JSON.parse(decodeURIComponent(escape(atob(h))));}catch(e){return null;}}"
          new = "function decodePayload(){try{var h=location.hash.slice(1);if(!h)return null;h=h.replace(/-/g,'+').replace(/_/g,'/');while(h.length%4)h+='=';var b=atob(h),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder('utf-8').decode(a));}catch(e){return null;}}"
          if old not in s:
            raise SystemExit("VIP payload decoder did not match the expected source; refusing a blind patch.")
          s = s.replace(old, new, 1)
          marker = "var payload=decodePayload(), C=payload&&payload.C;\n  if(!C)return;"
          replacement = marker + "\n  document.documentElement.setAttribute('data-inviteora-payload','loaded');"
          if marker not in s:
            raise SystemExit("VIP payload initialization marker not found.")
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding="utf-8")
          print("VIP base64url payload decoding fixed and successful payloads marked.")
          PY

      - name: Apply preview-only URL fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          old_base = "const SITE_BASE='https://inviteora-preview.vercel.app/';"
          new_base = "const SITE_BASE=location.origin+'/';"
          if old_base in s:
            s = s.replace(old_base, new_base, 1)
          elif new_base not in s:
            raise SystemExit("Template base URL is neither the known Vercel URL nor same-origin; refusing an unsafe patch.")
          p.write_text(s, encoding="utf-8")
          print("Preview links now stay on the Cloudflare Preview host.")
          PY

      - name: Apply current active-template host rendering patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("public/templates/mahad-laiba.html")
          if p.is_file():
            s = p.read_text(encoding="utf-8")
            needle = "function renderPages(){\n P=[];"
            replacement = """function renderPages(){
           P=[];
           const hostsBlock=(Array.isArray(C.hosts)?C.hosts:[]).map(n=>{const[a,b]=String(n||"").split("|");const name=a.trim();return name?\x60<div style="font-size:5.1cqw;line-height:1.15;margin:1.8cqw 0">\x24{esc(name)}\x24{b&&b.trim()?\x60<div class="sm" style="font-size:3.8cqw;margin-top:.5cqw">\x24{esc(b.trim())}</div>\x60:""}</div>\x60:""}).join("");
           const hostsMarkup=hostsBlock?\x60<div style="margin-top:3cqw"><div class="cap">\x24{esc(C.hostsTitle||"With best compliments")}</div>\x24{hostsBlock}</div>\x60:"";"""
            if needle not in s: raise SystemExit("Royal Events insertion point not found")
            s = s.replace(needle, replacement, 1)
            needle = "\x24{esc(C.a)} &amp; \x24{esc(C.b)}</div>\x24{C.whatsapp?"
            if needle not in s: raise SystemExit("Royal Events final-page insertion point not found")
            s = s.replace(needle, "\x24{esc(C.a)} &amp; \x24{esc(C.b)}</div>\x24{hostsMarkup}\x24{C.whatsapp?", 1)
            p.write_text(s, encoding="utf-8")

          p = Path("public/templates/ivory-pearl.html")
          if p.is_file():
            s = p.read_text(encoding="utf-8")
            needle = "const S=[];"
            replacement = """const escHost=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
          const hostsMarkup=(Array.isArray(C.hosts)?C.hosts:[]).map(n=>{const[a,b]=String(n||"").split("|");const name=a.trim();return name?\x60<div style="font-size:clamp(17px,4.5vw,24px);line-height:1.2;margin:10px 0">\x24{escHost(name)}\x24{b&&b.trim()?\x60<div class="s it" style="font-size:clamp(12px,3vw,16px);margin-top:3px">\x24{escHost(b.trim())}</div>\x60:""}</div>\x60:""}).join("");
          const hostsPage=hostsMarkup?\x60<div style="margin:22px auto 12px;max-width:90%"><div class="s it" style="font-size:clamp(15px,3.8vw,21px)">\x24{escHost(C.hostsTitle||"With best compliments")}</div><div class="s" style="color:#c99a46;margin:7px 0">✦ ✦ ✦</div>\x24{hostsMarkup}</div>\x60:"";
          const S=[];"""
            if needle not in s: raise SystemExit("Ivory Pearl insertion point not found")
            s = s.replace(needle, replacement, 1)
            needle = "\x24{C.groom} &amp; \x24{C.bride}</div><button class=\"btn x\" id=\"duab\">"
            if needle not in s: raise SystemExit("Ivory Pearl final-page insertion point not found")
            s = s.replace(needle, "\x24{C.groom} &amp; \x24{C.bride}</div>\x24{hostsPage}<button class=\"btn x\" id=\"duab\">", 1)
            p.write_text(s, encoding="utf-8")
          print("Active template hosts patches applied where source files exist.")
          PY

      - name: Remove retired duplicate designs using the existing release rule
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root = Path("public")
          registry = root / "templates.json"
          data = json.loads(registry.read_text(encoding="utf-8"))
          retired = re.compile(r"(royal[-_ ]?navy|royal[-_ ]?blue|hamza|areeba|099|velvet[-_ ]?curtain|green[-_ ]?velvet)", re.I)
          kept, removed = [], []
          for item in data.get("templates", []):
            identity = " ".join(str(item.get(k, "")) for k in ("id", "name", "file", "thumb", "tag"))
            if item.get("id") not in ("royal-navy-blue-gold", "royal-navy-gold-video", "velvet-curtain") and retired.search(identity):
              removed.append(item)
            else: kept.append(item)
          if not kept: raise SystemExit("Refusing to publish an empty gallery.")
          data["templates"] = kept
          for item in removed:
            for key in ("file", "thumb"):
              rel = item.get(key)
              if rel:
                target = (root / rel).resolve()
                if root.resolve() in target.parents and target.is_file(): target.unlink()
          registry.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Active templates:", [x.get("id") for x in kept])
          PY

      - name: Fix Royal Mughal Palace page navigation during smooth scrolling
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("public/templates/royal-mughal-palace-vip.html")
          if not p.is_file():
            raise SystemExit("Royal Mughal Palace source template is missing.")
          s = p.read_text(encoding="utf-8")
          pattern = r"pages\\.addEventListener\\('scroll',\\(\\)=>\\{const n=Math\\.round\\(pages\\.scrollLeft/Math\\.max\\(1,pages\\.clientWidth\\)\\);if\\(n!==idx\\)\\{idx=n;\\$\\('count'\\)\\.textContent=String\\(idx\\+1\\)\\.padStart\\(2,'0'\\)\\+' / '\\+String\\(pages\\.children\\.length\\)\\.padStart\\(2,'0'\\)\\}\\},\\{passive:true\\}\\);"
          s2, count = re.subn(pattern, "", s, count=1)
          if count != 1:
            raise SystemExit("Expected legacy scroll listener not found exactly once; refusing an unverified patch.")
          p.write_text(s2, encoding="utf-8")
          print("Removed conflicting scroll listener; button and swipe navigation now own page index updates.")
          PY

      - name: Validate generated site files
        run: |
          test -s public/index.html
          test -s public/admin.html
          test -s public/templates.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("public")
          data=json.loads((root/"templates.json").read_text())
          templates=data.get("templates",[])
          if not templates: raise SystemExit("Gallery has no templates")
          missing=[]
          for item in templates:
            for key in ("file","thumb"):
              value=item.get(key,"")
              if key=="file" and value and not (root/value).is_file(): missing.append(f"{item.get('id')}: {value}")
          if missing: raise SystemExit("Missing template files: "+", ".join(missing))
          print(f"Validated {len(templates)} gallery entries")
          PY

      - name: Upload built site for browser tests
        uses: actions/upload-artifact@v4
        with:
          name: inviteora-cloudflare-preview-site
          path: public/
          if-no-files-found: error
          retention-days: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Serve the built artifact locally
        run: |
          python3 -m http.server 4173 --directory public > /tmp/inviteora-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/templates.json >/dev/null

      - name: Run existing template and order-flow browser tests
        run: |
          npx playwright test tests/royal-navy-blue-gold.spec.js tests/invitation-video-previews.spec.js tests/order-flow.spec.js tests/template-contract.spec.js tests/normal-wedding-emerald.spec.js tests/grand-entrance.spec.js tests/vip-royal-wedding.spec.js tests/royal-mughal-palace-vip.spec.js tests/vip-royal-mughal-palace-four-video.spec.js tests/blush-garden.spec.js tests/burgundy-pearl-mehndi.spec.js --reporter=list
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Create the isolated Pages project only when absent
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare credentials are not configured; deployment skipped."
            exit 0
          fi

          API_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/inviteora-preview"
          HTTP_STATUS="$(curl --silent --show-error --request GET \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --output /tmp/cloudflare-project.json \
            --write-out "%{http_code}" "$API_URL")"

          if [ "$HTTP_STATUS" = "200" ] && jq -e '.success == true and .result.name == "inviteora-preview"' /tmp/cloudflare-project.json >/dev/null; then
            echo "Existing Pages project inviteora-preview verified; keeping it."
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "Pages project not found; creating the isolated preview project."
            npx wrangler@4 pages project create inviteora-preview --production-branch=main
          else
            echo "Cloudflare project lookup failed (HTTP $HTTP_STATUS); refusing to create or deploy blindly."
            cat /tmp/cloudflare-project.json
            exit 1
          fi

      - name: Deploy preview to Cloudflare Pages
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not configured yet; build and browser tests completed, deployment skipped."
            exit 0
          fi
          npx wrangler@4 pages deploy public --project-name=inviteora-preview --branch=cloudflare-preview-vip
