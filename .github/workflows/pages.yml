name: Deploy invitation site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'retailhub-invitations.zip'
      - 'site.zip'
      - 'site/**'
      - 'tests/**'
      - 'supabase/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'retailhub-invitations.zip'
      - 'site.zip'
      - 'site/**'
      - 'tests/**'
      - 'supabase/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pages-validation' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract website files
        run: |
          if [ -f retailhub-invitations.zip ]; then ZIP_PATH=retailhub-invitations.zip; else ZIP_PATH=site.zip; fi
          test -f "$ZIP_PATH"
          mkdir -p public
          unzip -q "$ZIP_PATH" -d extracted
          test -f extracted/site/index.html
          cp -R extracted/site/. public/
          if [ -f site/index.html ]; then cp site/index.html public/index.html; fi
          if [ -f site/admin.html ]; then cp site/admin.html public/admin.html; fi
          if [ -f site/templates/velvet-curtain/index.html ]; then mkdir -p public/templates/velvet-curtain; cp site/templates/velvet-curtain/index.html public/templates/velvet-curtain/index.html; fi
      - name: Build gallery template packages
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path

          source = Path("site/new-templates")
          public = Path("public")
          registry = public / "templates.json"
          if source.exists():
            data = json.loads(registry.read_text(encoding="utf-8"))
            items = data.setdefault("templates", [])
            known = {str(x.get("id")) for x in items}
            for folder in sorted(p for p in source.iterdir() if p.is_dir()):
              meta_path = folder / "template.json"
              html_path = folder / "template.html"
              if not meta_path.is_file() or not html_path.is_file():
                raise SystemExit(f"Incomplete template package: {folder}")
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              template_id = str(meta.get("id", "")).strip()
              if not template_id or template_id in known:
                raise SystemExit(f"Missing or duplicate template id: {template_id}")
              thumbs = [folder / ("thumbnail" + ext) for ext in (".svg", ".png", ".jpg", ".webp")]
              thumb_src = next((p for p in thumbs if p.is_file()), None)
              if thumb_src is None:
                raise SystemExit(f"Missing thumbnail in {folder}")
              html_rel = f"templates/{template_id}.html"
              thumb_rel = f"thumbs/{template_id}{thumb_src.suffix.lower()}"
              (public / "templates").mkdir(parents=True, exist_ok=True)
              (public / "thumbs").mkdir(parents=True, exist_ok=True)
              shutil.copy2(html_path, public / html_rel)
              shutil.copy2(thumb_src, public / thumb_rel)
              record = dict(meta)
              record["file"] = html_rel
              record["thumb"] = thumb_rel
              items.append(record)
              known.add(template_id)
            registry.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
            print("Added template packages:", [x.get("id") for x in items])
          PY
      - name: Render Hosts together on the final page of every active template
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Royal Events (Mahad & Laiba): place the hosts block inside its existing final page.
          p = Path("public/templates/mahad-laiba.html")
          s = p.read_text(encoding="utf-8")
          needle = "function renderPages(){\n P=[];"
          replacement = """function renderPages(){
           P=[];
           const hostsBlock=(Array.isArray(C.hosts)?C.hosts:[]).map(n=>{const[a,b]=String(n||"").split("|");const name=a.trim();return name?\x60<div style="font-size:5.1cqw;line-height:1.15;margin:1.8cqw 0">\x24{esc(name)}\x24{b&&b.trim()?\x60<div class="sm" style="font-size:3.8cqw;margin-top:.5cqw">\x24{esc(b.trim())}</div>\x60:""}</div>\x60:""}).join("");
           const hostsMarkup=hostsBlock?\x60<div style="margin-top:3cqw"><div class="cap">\x24{esc(C.hostsTitle||"With best compliments")}</div>\x24{hostsBlock}</div>\x60:"";"""
          if needle not in s:
              raise SystemExit("Royal Events: renderPages insertion point not found")
          s = s.replace(needle, replacement, 1)
          needle = "\x24{esc(C.a)} &amp; \x24{esc(C.b)}</div>\x24{C.whatsapp?"
          if needle not in s:
              raise SystemExit("Royal Events: final-page hosts insertion point not found")
          s = s.replace(needle, "\x24{esc(C.a)} &amp; \x24{esc(C.b)}</div>\x24{hostsMarkup}\x24{C.whatsapp?", 1)
          p.write_text(s, encoding="utf-8")

          # Ivory Pearl: append hosts to its existing final page.
          p = Path("public/templates/ivory-pearl.html")
          s = p.read_text(encoding="utf-8")
          needle = "const S=[];"
          replacement = """const escHost=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
          const hostsMarkup=(Array.isArray(C.hosts)?C.hosts:[]).map(n=>{const[a,b]=String(n||"").split("|");const name=a.trim();return name?\x60<div style="font-size:clamp(17px,4.5vw,24px);line-height:1.2;margin:10px 0">\x24{escHost(name)}\x24{b&&b.trim()?\x60<div class="s it" style="font-size:clamp(12px,3vw,16px);margin-top:3px">\x24{escHost(b.trim())}</div>\x60:""}</div>\x60:""}).join("");
          const hostsPage=hostsMarkup?\x60<div style="margin:22px auto 12px;max-width:90%"><div class="s it" style="font-size:clamp(15px,3.8vw,21px)">\x24{escHost(C.hostsTitle||"With best compliments")}</div><div class="s" style="color:#c99a46;margin:7px 0">✦ ✦ ✦</div>\x24{hostsMarkup}</div>\x60:"";
          const S=[];"""
          if needle not in s:
              raise SystemExit("Ivory Pearl: insertion point not found")
          s = s.replace(needle, replacement, 1)
          needle = '\x24{C.groom} &amp; \x24{C.bride}</div><button class="btn x" id="duab">'
          if needle not in s:
              raise SystemExit("Ivory Pearl: final-page hosts insertion point not found")
          s = s.replace(needle, '\x24{C.groom} &amp; \x24{C.bride}</div>\x24{hostsPage}<button class="btn x" id="duab">', 1)
          p.write_text(s, encoding="utf-8")

          print("Hosts final-page rendering patched for remaining active templates.")
          PY
      - name: Remove retired duplicate invitation designs from the published gallery
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root = Path("public")
          registry = root / "templates.json"
          data = json.loads(registry.read_text(encoding="utf-8"))
          retired = re.compile(r"(royal[-_ ]?navy|royal[-_ ]?blue|hamza|areeba|099|velvet[-_ ]?curtain|green[-_ ]?velvet)", re.I)
          kept = []
          removed = []
          for item in data.get("templates", []):
            identity = " ".join(str(item.get(k, "")) for k in ("id", "name", "file", "thumb", "tag"))
            # Keep the current Royal Navy Blue & Gold product template published.
            # Other retired Royal Navy / Hamza-Areeba duplicates remain filtered.
            if item.get("id") not in ("royal-navy-blue-gold", "royal-navy-gold-video", "velvet-curtain") and retired.search(identity):
              removed.append(item)
              continue
            kept.append(item)
          if not kept:
            raise SystemExit("Refusing to publish an empty gallery; review the retirement filter.")
          data["templates"] = kept
          for item in removed:
            for key in ("file", "thumb"):
              rel = item.get(key)
              if rel:
                target = (root / rel).resolve()
                if root.resolve() in target.parents and target.is_file():
                  target.unlink()
          # Keep the Velvet Curtain direct preview route available for its Shopify product.
          registry.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Retired templates removed:", [x.get("name", x.get("id")) for x in removed])
          print("Remaining active templates:", [x.get("name", x.get("id")) for x in kept])
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Upload browser-test site artifact
        uses: actions/upload-artifact@v4
        with:
          name: invitation-public-site
          path: public/
          if-no-files-found: error
          retention-days: 1
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

  browser-test:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download the exact site artifact built above
        uses: actions/download-artifact@v4
        with:
          name: invitation-public-site
          path: public
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve the built artifact locally
        run: |
          python3 -m http.server 4173 --directory public > /tmp/invitation-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/templates.json >/dev/null
      - name: Test the exact built artifact
        run: npx playwright test tests/royal-navy-blue-gold.spec.js tests/invitation-video-previews.spec.js --reporter=list
        env:
          BASE_URL: http://127.0.0.1:4173
