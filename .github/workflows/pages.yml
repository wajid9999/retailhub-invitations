name: Deploy invitation site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'retailhub-invitations.zip'
      - 'site.zip'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract website files
        run: |
          if [ -f retailhub-invitations.zip ]; then ZIP_PATH=retailhub-invitations.zip; else ZIP_PATH=site.zip; fi
          test -f "$ZIP_PATH"
          mkdir -p public
          unzip -q "$ZIP_PATH" -d extracted
          test -f extracted/site/index.html
          cp -R extracted/site/. public/
          if [ -f site/index.html ]; then cp site/index.html public/index.html; fi
      - name: Add Velvet Curtain template
        run: |
          test -f site/velvet-curtain-website-package.zip
          mkdir -p velvet-package public/templates/velvet-curtain public/thumbs
          unzip -q site/velvet-curtain-website-package.zip -d velvet-package
          test -f velvet-package/velvet-curtain/index.html
          cp velvet-package/velvet-curtain/index.html public/templates/velvet-curtain/index.html
          cp velvet-package/velvet-curtain/thumb.jpg public/thumbs/velvet-curtain.jpg
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("public/templates/velvet-curtain/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("const C={", "let C={", 1)
          # The source package has only a poster/no playable video source. Replace
          # that broken playback dependency with a real CSS curtain reveal.
          s = s.replace('<video id="vid"', '<video id="vid" style="display:none"')
          s = s.replace('<canvas id="fx"></canvas>', '<div id="curtain-left" aria-hidden="true"></div><div id="curtain-right" aria-hidden="true"></div>\n  <canvas id="fx"></canvas>', 1)
          poster_match = re.search(r'<video id="vid"[^>]*poster="(data:image/[^"]+)"', s)
          if not poster_match:
              raise SystemExit("Could not find original closed-curtain poster")
          poster = poster_match.group(1)
          curtain_css = f"""
          #curtain-left,#curtain-right{{position:absolute;top:0;bottom:0;width:50%;z-index:8;pointer-events:none;opacity:1;background-image:url("{poster}");background-repeat:no-repeat;background-size:200% 100%;box-shadow:inset 0 0 30px rgba(0,0,0,.24);transition:transform 1.55s cubic-bezier(.62,0,.32,1)}}
          #curtain-left{{left:0;background-position:left center;transform-origin:left center}}
          #curtain-right{{right:0;background-position:right center;transform-origin:right center}}
          .started #curtain-left{{transform:translateX(-105%)}}
          .started #curtain-right{{transform:translateX(105%)}}
          #still{{filter:brightness(1.12) contrast(1.02)}}
          .wm{{color:rgba(255,244,210,.58)!important;text-shadow:0 2px 8px rgba(0,0,0,.82),0 0 3px rgba(0,0,0,.7)!important}}
          #intro{{z-index:10}}
          @media(prefers-reduced-motion:reduce){{#curtain-left,#curtain-right{{transition-duration:.01ms}}}}
          """
          s = s.replace("</style>", curtain_css + "\n</style>", 1)
          s = s.replace('function start(){if(started)return;started=true;app.classList.add("started");vid.play().catch(()=>{});}', 'function start(){if(started)return;started=true;app.classList.add("started","go","t1","t2","ended");}')

          pat = re.compile(r"let C=(\{.*?\n\});", re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit("Could not find Velvet Curtain data block")
          boot = r"""
          const rawPayload = location.hash.length > 1 ? location.hash.slice(1) : "";
          if (rawPayload) {
            try {
              const decoded = decodeURIComponent(escape(atob(rawPayload)));
              const payload = JSON.parse(decoded);
              if (payload && payload.C) C = payload.C;
            } catch (e) { console.error("Invitation data could not be read", e); }
          }
          const introNames = document.querySelector("#intro .script");
          if (introNames) introNames.innerHTML = String(C.groom || "Groom") + "<br><small style='font-size:.5em'>&amp;</small><br>" + String(C.bride || "Bride");
          """
          s = s[:m.end()] + boot + s[m.end():]
          p.write_text(s, encoding="utf-8")
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("public/templates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["templates"] = [t for t in data.get("templates", []) if t.get("id") != "velvet-curtain"]
          data["templates"].append({
            "id": "velvet-curtain",
            "name": "Velvet Curtain",
            "tag": "Green velvet curtains, glowing lanterns and sparkling lights",
            "file": "templates/velvet-curtain/index.html",
            "thumb": "thumbs/velvet-curtain.jpg",
            "tier": "premium",
            "occasion": "wedding",
            "ad": "velvet",
            "fam": False
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
