name: Deploy invitation site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'retailhub-invitations.zip'
      - 'site.zip'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'retailhub-invitations.zip'
      - 'site.zip'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pages-validation' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract website files
        run: |
          if [ -f retailhub-invitations.zip ]; then ZIP_PATH=retailhub-invitations.zip; else ZIP_PATH=site.zip; fi
          test -f "$ZIP_PATH"
          mkdir -p public
          unzip -q "$ZIP_PATH" -d extracted
          test -f extracted/site/index.html
          cp -R extracted/site/. public/
          if [ -f site/index.html ]; then cp site/index.html public/index.html; fi
          if [ -f site/admin.html ]; then cp site/admin.html public/admin.html; fi
      - name: Add Velvet Curtain template
        run: |
          test -f site/velvet-curtain-website-package.zip
          mkdir -p velvet-package public/templates/velvet-curtain public/thumbs
          unzip -q site/velvet-curtain-website-package.zip -d velvet-package
          test -f velvet-package/velvet-curtain/index.html
          cp velvet-package/velvet-curtain/index.html public/templates/velvet-curtain/index.html
          cp velvet-package/velvet-curtain/thumb.jpg public/thumbs/velvet-curtain.jpg
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("public/templates/velvet-curtain/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("const C={", "let C={", 1)
          # Preserve the original embedded video: it contains the curtain animation,
          # lantern reveal, and AAC soundtrack. Start only after the visitor taps.
          # Replace the original playback handler regardless of its previous version.
          playback = r'''let started=false,startPending=false;
          const intro=$("#intro");
          function start(){
            if(started||startPending)return;
            startPending=true;
            const play=vid.play();
            if(play&&typeof play.then==="function"){
              play.then(()=>{started=true;startPending=false;app.classList.add("started");})
                  .catch(e=>{startPending=false;console.warn("Video playback was blocked; tap again to retry",e);});
            }else{started=true;startPending=false;app.classList.add("started");}
          }
          intro.addEventListener("click",start);
          intro.addEventListener("pointerup",start);
          intro.addEventListener("touchend",start,{passive:true});
          app.addEventListener("pointerup",start,{capture:true});'''
          s, count = re.subn(r'function start\(\)\{.*?\}\s*\$\("#intro"\)\.onclick=start;', lambda _: playback, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not replace the Velvet Curtain playback handler")
          # The source already declares started once immediately before the
          # original handler; the replacement declares it with startPending.
          s = s.replace("/* playback */\nlet started=false;\n", "/* playback */\n", 1)

          pat = re.compile(r"let C=(\{.*?\n\});", re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit("Could not find Velvet Curtain data block")
          boot = r"""
          const rawPayload = location.hash.length > 1 ? location.hash.slice(1) : "";
          if (rawPayload) {
            try {
              const decoded = decodeURIComponent(escape(atob(rawPayload)));
              const payload = JSON.parse(decoded);
              if (payload && payload.C) C = payload.C;
            } catch (e) { console.error("Invitation data could not be read", e); }
          }
          const introNames = document.querySelector("#intro .script");
          if (introNames) introNames.innerHTML = String(C.groom || "Groom") + "<br><small style='font-size:.5em'>&amp;</small><br>" + String(C.bride || "Bride");
          """
          s = s[:m.end()] + boot + s[m.end():]
          p.write_text(s, encoding="utf-8")
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("public/templates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["templates"] = [t for t in data.get("templates", []) if t.get("id") != "velvet-curtain"]
          data["templates"].append({
            "id": "velvet-curtain",
            "name": "Velvet Curtain",
            "tag": "Green velvet curtains, glowing lanterns and sparkling lights",
            "file": "templates/velvet-curtain/index.html",
            "thumb": "thumbs/velvet-curtain.jpg",
            "tier": "premium",
            "occasion": "wedding",
            "ad": "velvet",
            "fam": False
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Add Hamza & Areeba wedding invitation template
        run: |
          mkdir -p public/templates public/thumbs
          test -s site/hamza-areeba.html
          test -s site/hamza-areeba-thumb.svg
          cp site/hamza-areeba.html public/templates/hamza-areeba.html
          cp site/hamza-areeba-thumb.svg public/thumbs/hamza-areeba.svg
          python3 - <<'PY'
          import json
          from pathlib import Path
          html = Path("public/templates/hamza-areeba.html").read_text(encoding="utf-8")
          if '<video id="vid"' not in html or 'data:video/mp4;base64,' not in html:
              raise SystemExit("Hamza & Areeba: opening video or embedded video source is missing")
          if 'intro.addEventListener("click",start)' not in html:
              raise SystemExit("Hamza & Areeba: intro playback tap handler is missing")
          p = Path("public/templates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["templates"] = [t for t in data.get("templates", []) if t.get("id") != "hamza-areeba"]
          data["templates"].append({
            "id": "hamza-areeba",
            "name": "Hamza & Areeba",
            "tag": "Wedding invitation with an opening video reveal",
            "file": "templates/hamza-areeba.html",
            "thumb": "thumbs/hamza-areeba.svg",
            "tier": "premium",
            "occasion": "wedding",
            "ad": "std",
            "fam": False
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Hamza & Areeba template and opening-video checks passed.")
          PY
      - name: Add Royal Navy Blue & Gold and remove duplicate Velvet Curtain
        run: |
          mkdir -p public/templates public/thumbs
          test -s site/royal-navy-blue-gold.html
          test -s site/royal-navy-blue-gold-thumb.svg
          cp site/royal-navy-blue-gold.html public/templates/royal-navy-blue-gold.html
          cp site/royal-navy-blue-gold-thumb.svg public/thumbs/royal-navy-blue-gold.svg
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("public/templates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["templates"] = [t for t in data.get("templates", []) if t.get("id") not in {"velvet-curtain", "royal-navy-blue-gold"}]
          navy = {
            "id": "royal-navy-blue-gold",
            "name": "Royal Navy Blue & Gold",
            "tag": "Navy velvet, Mughal arch, golden lanterns and ornate invitation card",
            "file": "templates/royal-navy-blue-gold.html",
            "thumb": "thumbs/royal-navy-blue-gold.svg",
            "tier": "premium",
            "occasion": "wedding",
            "ad": "std",
            "fam": False
          }
          data["templates"].insert(0, navy)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          assert data["templates"][0]["id"] == "royal-navy-blue-gold"
          assert not any(t.get("id") == "velvet-curtain" for t in data["templates"])
          print("Royal Navy Blue & Gold is first; duplicate Velvet Curtain removed.")
          PY
      - name: Render Hosts together on the final page of every active template
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Royal Events (Mahad & Laiba): place the hosts block inside its existing final page.
          p = Path("public/templates/mahad-laiba.html")
          s = p.read_text(encoding="utf-8")
          needle = "function renderPages(){\n P=[];"
          replacement = """function renderPages(){
           P=[];
           const hostsBlock=(Array.isArray(C.hosts)?C.hosts:[]).map(n=>{const[a,b]=String(n||"").split("|");const name=a.trim();return name?\x60<div style="font-size:5.1cqw;line-height:1.15;margin:1.8cqw 0">\x24{esc(name)}\x24{b&&b.trim()?\x60<div class="sm" style="font-size:3.8cqw;margin-top:.5cqw">\x24{esc(b.trim())}</div>\x60:""}</div>\x60:""}).join("");
           const hostsMarkup=hostsBlock?\x60<div style="margin-top:3cqw"><div class="cap">\x24{esc(C.hostsTitle||"With best compliments")}</div>\x24{hostsBlock}</div>\x60:"";"""
          if needle not in s:
              raise SystemExit("Royal Events: renderPages insertion point not found")
          s = s.replace(needle, replacement, 1)
          needle = "\x24{esc(C.a)} &amp; \x24{esc(C.b)}</div>\x24{C.whatsapp?"
          if needle not in s:
              raise SystemExit("Royal Events: final-page hosts insertion point not found")
          s = s.replace(needle, "\x24{esc(C.a)} &amp; \x24{esc(C.b)}</div>\x24{hostsMarkup}\x24{C.whatsapp?", 1)
          p.write_text(s, encoding="utf-8")

          # Ivory Pearl: append hosts to its existing final page.
          p = Path("public/templates/ivory-pearl.html")
          s = p.read_text(encoding="utf-8")
          needle = "const S=[];"
          replacement = """const escHost=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
          const hostsMarkup=(Array.isArray(C.hosts)?C.hosts:[]).map(n=>{const[a,b]=String(n||"").split("|");const name=a.trim();return name?\x60<div style="font-size:clamp(17px,4.5vw,24px);line-height:1.2;margin:10px 0">\x24{escHost(name)}\x24{b&&b.trim()?\x60<div class="s it" style="font-size:clamp(12px,3vw,16px);margin-top:3px">\x24{escHost(b.trim())}</div>\x60:""}</div>\x60:""}).join("");
          const hostsPage=hostsMarkup?\x60<div style="margin:22px auto 12px;max-width:90%"><div class="s it" style="font-size:clamp(15px,3.8vw,21px)">\x24{escHost(C.hostsTitle||"With best compliments")}</div><div class="s" style="color:#c99a46;margin:7px 0">✦ ✦ ✦</div>\x24{hostsMarkup}</div>\x60:"";
          const S=[];"""
          if needle not in s:
              raise SystemExit("Ivory Pearl: insertion point not found")
          s = s.replace(needle, replacement, 1)
          needle = '\x24{C.groom} &amp; \x24{C.bride}</div><button class="btn x" id="duab">'
          if needle not in s:
              raise SystemExit("Ivory Pearl: final-page hosts insertion point not found")
          s = s.replace(needle, '\x24{C.groom} &amp; \x24{C.bride}</div>\x24{hostsPage}<button class="btn x" id="duab">', 1)
          p.write_text(s, encoding="utf-8")

          # Velvet Curtain: move the already-supported hosts section after the end page.
          p = Path("public/templates/velvet-curtain/index.html")
          s = p.read_text(encoding="utf-8")
          # Define the hosts section before it is appended; the original package
          # referenced hostsS without declaring it, which stopped the page script.
          hosts_code = '''const hostsS=(Array.isArray(C.hosts)?C.hosts:[]).map(n=>{const raw=typeof n==="string"?n:String(n&&n.name||"");const[a,b]=raw.split("|");const name=a.trim();return name?\x60<div class="pp" style="text-align:center;padding:18px 12px"><div class="s it">\x24{String(C.hostsTitle||"With best compliments")}</div><div class="script gold" style="font-size:clamp(20px,5vw,30px);margin:8px 0">\x24{ name.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])) }</div>\x24{b&&b.trim()?\x60<div class="s it">\x24{b.trim()}</div>\x60:""}</div>\x60:""}).join("");'''
          anchor = "scr.innerHTML=hero+"
          if anchor not in s:
              raise SystemExit("Velvet Curtain: render insertion point not found")
          s = s.replace(anchor, hosts_code + "\n" + anchor, 1)
          old = "scr.innerHTML=hero+'<div class=\"roll\"></div>'+evS+faq+end;"
          new = "scr.innerHTML=hero+'<div class=\"roll\"></div>'+evS+faq+end+hostsS;"
          if old not in s:
              raise SystemExit("Velvet Curtain: expected hosts section placement not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          print("Hosts final-page rendering patched for Royal Events, Ivory Pearl, and Velvet Curtain.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Upload browser-test site artifact
        uses: actions/upload-artifact@v4
        with:
          name: invitation-public-site
          path: public/
          if-no-files-found: error
          retention-days: 1
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

  browser-test:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download the exact site artifact built above
        uses: actions/download-artifact@v4
        with:
          name: invitation-public-site
          path: public
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve the built artifact locally
        run: |
          python3 -m http.server 4173 --directory public > /tmp/invitation-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/templates.json >/dev/null
      - name: Test the exact built artifact
        run: npx playwright test tests/velvet-curtain.spec.js tests/royal-navy-blue-gold.spec.js --reporter=list
        env:
          BASE_URL: http://127.0.0.1:4173
