name: Velvet Curtain browser regression test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/velvet-curtain-test.yml'
      - 'tests/velvet-curtain.spec.js'

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Run live invitation browser test
        run: npx playwright test tests/velvet-curtain.spec.js --reporter=list
        env:
          BASE_URL: https://wajid9999.github.io/retailhub-invitations
