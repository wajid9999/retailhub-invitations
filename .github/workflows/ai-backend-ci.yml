name: AI backend checks

on:
  push:
    branches: ["ai-backend/**"]
    paths:
      - "ai-backend/**"
      - ".github/workflows/ai-backend-ci.yml"
  pull_request:
    paths:
      - "ai-backend/**"
      - ".github/workflows/ai-backend-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build Mastra app
        run: npm run build
