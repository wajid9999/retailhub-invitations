<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Royal Navy Blue &amp; Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#071226;--navy2:#101d38;--gold:#c9a45d;--gold2:#f0d99b;--ivory:#f7edcf;--ink:#49351b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050b17;color:var(--ivory)}body{font-family:Jost, sans-serif;display:flex;justify-content:center;align-items:center;min-height:100svh;padding:18px;background:radial-gradient(ellipse at 50% 25%,#263653 0,#0a1429 50%,#030712 100%);overflow-x:hidden}
.stage{width:min(100%,520px);text-align:center}.eyebrow{font:italic 20px 'Cormorant Garamond',serif;color:var(--gold2);margin:0 0 12px}
.scene{position:relative;min-height:min(76svh,760px);display:grid;place-items:center;isolation:isolate;border:1px solid #8e6b32;box-shadow:0 20px 65px #000b;overflow:hidden;background:linear-gradient(145deg,#071226,#14213b 52%,#050b18);padding:28px 18px}
.scene:before,.scene:after{content:"";position:absolute;inset:12px;border:1px solid #c8a15b;pointer-events:none;z-index:4}.scene:after{inset:18px;border-color:#8e6b32}
.curtain{position:absolute;z-index:3;top:0;bottom:0;width:23%;background:repeating-linear-gradient(90deg,#030a18 0 8px,#101e39 9px 17px,#071226 18px 25px);box-shadow:inset 0 0 28px #000,0 0 18px #000}.curtain.left{left:0;clip-path:polygon(0 0,100% 0,83% 18%,100% 40%,83% 65%,100% 100%,0 100%)}.curtain.right{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,83% 18%,100% 40%,83% 65%,100% 100%,0 100%)}
.embroider{position:absolute;top:0;bottom:0;width:7%;z-index:4;opacity:.95;background:repeating-linear-gradient(135deg,transparent 0 10px,#c59a4b 11px 12px,transparent 13px 19px);filter:drop-shadow(0 0 2px #d9b66c)}.embroider.l{left:4%}.embroider.r{right:4%}
.arch{position:absolute;inset:7% 12% 9%;border:3px solid #b78b43;border-bottom:0;border-radius:48% 48% 0 0/24% 24% 0 0;box-shadow:0 0 0 7px #74542c,0 0 40px #d1a65a44,inset 0 0 30px #c99b4a33}
.lanterns{position:absolute;top:8%;left:0;right:0;display:flex;justify-content:space-evenly;z-index:2;color:#f7d98c;font-size:30px;text-shadow:0 0 15px #ffc65c}
.card{position:relative;z-index:2;width:min(76%,350px);padding:38px 20px 30px;background:radial-gradient(ellipse at 50% 20%,#fff6df,#ead7a9 75%,#d8bd83);color:var(--ink);border:3px double #b48a43;box-shadow:0 12px 38px #0009;font-family:'Cormorant Garamond',serif}
.card:before{content:"";position:absolute;inset:9px;border:1px solid #b58a45;pointer-events:none}.orn{font-size:24px;color:#a77a34;letter-spacing:8px}.blessing{font-size:clamp(13px,3.6vw,17px);font-style:italic;margin:18px 0 8px}.names{font-size:clamp(30px,8vw,48px);line-height:1.05;color:#75501d;font-weight:600}.sub{font-size:clamp(16px,4vw,21px);font-style:italic;margin:14px 0}.details{font-size:16px;line-height:1.7;margin-top:20px}.seal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:18px auto 0;background:radial-gradient(circle,#9f1e27,#4d0911);border:2px solid #d5ad5e;color:#f5d98d;font-size:25px;box-shadow:0 3px 10px #0008}
.action{margin-top:16px;border:1px solid #e5c77f;border-radius:28px;background:linear-gradient(120deg,#a87b37,#f1d48b,#a87b37);color:#111b2c;padding:14px 28px;font:600 15px Jost;cursor:pointer;box-shadow:0 6px 18px #0008}.hint{font-size:12px;color:#d4c49c;margin:9px 0}
.edit{display:none;margin:14px auto 0;max-width:420px;text-align:left;background:#101c32;border:1px solid #98733c;padding:14px;border-radius:12px}.edit.show{display:grid;gap:8px}.edit label{font-size:12px;color:#ead39b}.edit input{width:100%;padding:10px;border-radius:7px;border:1px solid #8d754c;background:#071226;color:white}
@media(max-width:390px){.scene{min-height:72svh;padding:18px 8px}.card{width:78%;padding:28px 14px 22px}.curtain{width:21%}.lanterns{font-size:24px}}
</style></head><body><main class="stage"><p class="eyebrow">An invitation wrapped in timeless elegance</p>
<section class="scene" id="scene"><div class="arch"></div><div class="curtain left"></div><div class="curtain right"></div><div class="embroider l"></div><div class="embroider r"></div><div class="lanterns"><span>♜</span><span>♜</span><span>♜</span></div>
<article class="card"><div class="orn">❧ ✦ ❧</div><div class="blessing" id="blessing">Together with the blessings of Allah</div><div class="names" id="names">Groom<br><span style="font-size:.55em">&amp;</span><br>Bride</div><div class="sub" id="sub">request the honour of your presence<br>at their wedding</div><div class="orn">❧ ✦ ❧</div><div class="details" id="details">Sunday, 11 April 2027<br>4:00 PM<br>Wedding Reception</div><div class="seal">✦</div></article></section>
<button class="action" id="customise">Preview &amp; customise</button><p class="hint">Royal Navy Blue &amp; Gold · Mughal-inspired wedding invitation</p>
<div class="edit" id="edit"><label>Groom name</label><input id="groom" value="Groom"><label>Bride name</label><input id="bride" value="Bride"><label>Date &amp; time</label><input id="date" value="Sunday, 11 April 2027 · 4:00 PM"><label>Venue</label><input id="venue" value="Wedding Reception"><button class="action" id="apply">Update invitation</button></div>
</main><script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data={groom:"Groom",bride:"Bride",date:"",venue:"",events:[]};
try{if(location.hash.length>1){const raw=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));data={...data,...(raw.C||raw)}}}catch(e){console.warn("Invitation data unavailable",e)}
function formatDate(value){if(!value)return "";const d=new Date(String(value).slice(0,10)+"T00:00:00");return Number.isNaN(d.getTime())?String(value):d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function eventMarkup(){const events=Array.isArray(data.events)?data.events:[];if(!events.length)return [data.date,data.venue].filter(Boolean).map(esc).join("<br>");return events.map(event=>[formatDate(event.date)+(event.timeText?" · "+event.timeText:""),event.name,event.venue,event.address].filter(Boolean).map(esc).join("<br>")).join("<br><br>")}
function render(){$("names").innerHTML=esc(data.groom||"Groom")+"<br><span style='font-size:.55em'>&amp;</span><br>"+esc(data.bride||"Bride");$("details").innerHTML=eventMarkup()||"Wedding celebration";$("groom").value=data.groom||"";$("bride").value=data.bride||"";const first=Array.isArray(data.events)&&data.events.length?data.events[0]:null;$("date").value=first?(first.date||"")+(first.timeText?" · "+first.timeText:""):(data.date||"");$("venue").value=first?(first.venue||""):(data.venue||"")}
$("customise").addEventListener("click",()=> $("edit").classList.toggle("show"));
$("apply").addEventListener("click",()=>{data.groom=$("groom").value;data.bride=$("bride").value;if(Array.isArray(data.events)&&data.events.length){data.events[0]={...data.events[0],venue:$("venue").value};const rawDate=$("date").value.trim();if(/^\d{4}-\d{2}-\d{2}$/.test(rawDate))data.events[0].date=rawDate;else data.date=rawDate}else{data.date=$("date").value;data.venue=$("venue").value}render();$("edit").classList.remove("show")});
render();
</script></body></html>
