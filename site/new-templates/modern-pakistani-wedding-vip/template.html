<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modern Pakistani Wedding VIP · Inviteora</title>
<style>
:root{color-scheme:dark;--gold:#e4c27a;--ink:#fff7e8;--muted:#e8dcc6;--navy:#101a2b}
*{box-sizing:border-box}html,body{margin:0;background:#080d16;color:var(--ink);font-family:Georgia,serif}
body{padding:0 0 env(safe-area-inset-bottom)}.wrap{max-width:560px;margin:auto;overflow:hidden;background:var(--navy)}
.hero{min-height:78svh;display:grid;place-items:center;text-align:center;padding:42px 24px;background:radial-gradient(ellipse at 50% 45%,#36415a 0,#172338 48%,#090f1b 100%);border-bottom:1px solid #9d814a}
.kicker{letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font:11px Arial,sans-serif}.names{font-size:clamp(40px,11vw,64px);line-height:1.02;margin:18px 0;color:#f8e8c1}.amp{color:var(--gold);font-style:italic}.family{font-size:15px;line-height:1.7;color:var(--muted);margin:20px auto;max-width:390px}.scroll{font:11px Arial,sans-serif;letter-spacing:.18em;color:var(--gold);margin-top:38px}
.scene{position:relative;min-height:640px;min-height:90svh;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid #8b713e;background:#101827}
.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.72)}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,8,15,.96),rgba(4,8,15,.05) 72%)}
.details{position:relative;z-index:1;width:100%;padding:34px 25px 46px;text-align:center;text-shadow:0 2px 12px #000}
.num{font:11px Arial,sans-serif;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}.details h2{font-size:38px;font-weight:400;margin:9px 0 14px;color:#ffedc5}
.line{height:1px;width:58px;background:var(--gold);margin:12px auto}.hosts{font-size:15px;color:#f1dfbd}.when{font-size:18px;line-height:1.55;margin:12px 0}.venue{font-size:16px;line-height:1.5;color:#f6e7ca}.closing{text-align:center;padding:48px 24px 62px;background:linear-gradient(#17243a,#090f19)}
.closing h2{font-size:34px;color:var(--gold);font-weight:400}.closing p{line-height:1.8;color:var(--muted)}
.watermark{position:fixed;z-index:9;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font:900 42px Arial,sans-serif;letter-spacing:.18em;color:rgba(255,255,255,.25);border:4px solid rgba(255,255,255,.24);padding:8px 18px;pointer-events:none}
[dir=rtl]{font-family:Tahoma,Arial,sans-serif}.lang{position:fixed;z-index:10;right:12px;top:12px;border:1px solid var(--gold);border-radius:30px;background:#111a2b;color:var(--gold);padding:9px 14px}
@media(min-width:600px){.scene{min-height:760px}.hero{min-height:760px}}
</style></head><body><main class="wrap" id="invite" hidden></main><div class="watermark" id="wm">SAMPLE</div><button class="lang" id="lang">اردو</button>
<script>
(()=>{'use strict';
const root=document.documentElement,app=document.getElementById('invite'),wm=document.getElementById('wm');
const base='/modern-pakistani-wedding-vip/assets/videos/';
const clips=['VIP-Mehndi.mp4','VIP-Baraat.mp4','VIP-Nikah.mp4','VIP-Walima.mp4'];
const labels=['Mehndi','Baraat','Nikah','Walima'];
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>{if(!v)return'';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?safe(v):d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})};
const time=v=>{if(!v)return'';const m=String(v).match(/^(\d{1,2}):(\d{2})/);if(!m)return safe(v);const h=+m[1];return (h%12||12)+':'+m[2]+' '+(h>=12?'PM':'AM')};
let data={C:{groom:'',bride:'',events:[],sample:true},final:false},urdu=false;
function decode(){try{const raw=location.hash.slice(1);if(!raw)return;const json=decodeURIComponent(escape(atob(raw)));const x=JSON.parse(json);if(x&&x.C&&Array.isArray(x.C.events))data=x;}catch(e){console.error('Inviteora payload error',e)}}
function render(){
 const c=data.C||{},ev=c.events||[],g=safe(c.groom||'Groom'),b=safe(c.bride||'Bride');
 const family=[c.groomParents&&safe(c.groomParents),c.brideParents&&safe(c.brideParents)].filter(Boolean).join(' · ');
 const eventHtml=labels.map((label,i)=>{const e=ev[i]||{},name=e.name||label,dt=date(e.date),tm=time(e.timeText||e.time),venue=[e.venue,e.address].filter(Boolean).map(safe).join('<br>');
 return '<section class="scene"><video muted playsinline loop autoplay preload="'+(i===0?'auto':'none')+'" '+(i?'loading="lazy"':'')+'><source src="'+base+clips[i]+'" type="video/mp4"></video><div class="details"><div class="num">Celebration '+(i+1)+' · '+safe(label)+'</div><h2>'+safe(name)+'</h2><div class="line"></div>'+(e.hosts?'<div class="hosts">'+safe(e.hosts)+'</div>':'')+'<div class="when">'+[dt,tm].filter(Boolean).join(' · ')+'</div>'+(venue?'<div class="venue">'+venue+'</div>':'')+'</div></section>';
 }).join('');
 app.innerHTML='<section class="hero"><div><div class="kicker">Together with our families</div><h1 class="names">'+g+'<br><span class="amp">&amp;</span><br>'+b+'</h1>'+(family?'<div class="family">'+family+'</div>':'')+'<div class="family">'+safe(c.message||'With the blessings of our families, we invite you to celebrate our wedding.')+'</div><div class="scroll">SCROLL TO EXPLORE</div></div></section>'+eventHtml+'<section class="closing"><div class="kicker">With love & gratitude</div><h2>'+safe(c.closing||'Your presence will make our celebrations complete')+'</h2>'+(c.hosts&&c.hosts.length?'<p>'+safe(c.hostsTitle||'With best compliments')+'<br>'+c.hosts.map(x=>safe(typeof x==='string'?x:x.name)).join('<br>')+'</p>':'')+'<p>We look forward to celebrating with you.</p></section>';
 wm.hidden=!!data.final||c.sample===false;app.hidden=false;root.dataset.inviteoraPayload='loaded';
}
document.getElementById('lang').onclick=()=>{urdu=!urdu;root.lang=urdu?'ur':'en';root.dir=urdu?'rtl':'ltr';document.getElementById('lang').textContent=urdu?'English':'اردو';};
decode();render();addEventListener('hashchange',()=>{decode();render()});
})();
</script></body></html>
