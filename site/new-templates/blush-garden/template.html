<html lang="en">

<style>
:root{--ink:#4a3640;--gold:#a97c2f;--rose:#b4586f;--bg:#f9f8f3;box-sizing:border-box}

html,body{height:100%;margin:0;background:#e9e6dc;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif}
#app{visibility:hidden;position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}

@keyframes in{from{opacity:0;filter:blur(10px);transform:translate(-50%,-50%) scale(1.06)}}
#art>img{display:block;width:100%;height:100%}
.sd #sh{display:none}.sd #art{filter:blur(7px);opacity:.42;transform:translate(-50%,-50%) scale(1.05)}
#ht{position:absolute;left:36%;top:24%;width:46%;height:40%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .4s}
#ht>*{opacity:0;animation:up 1.1s both}
@keyframes up{from{opacity:0;transform:translateY(calc(var(--u,.5px)*16))}to{opacity:1;transform:none}}
.ar{font-family:"Aref Ruqaa",Amiri,serif;direction:rtl}.script{font-family:"Great Vibes",cursive;line-height:1.02}.it{font-style:italic}
.fg{background:linear-gradient(180deg,#c9964a,#8a5d1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.fn{background:linear-gradient(180deg,#d98aa0,#8f3d57);-webkit-background-clip:text;background-clip:text;color:transparent}
#sh{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;text-align:center;font-size:12px;letter-spacing:.24em;color:var(--gold);animation:bl 2.4s infinite;transition:opacity .4s;z-index:3;pointer-events:none}
@keyframes bl{50%{opacity:.35}}

#scr .sc{min-height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12vh 26px 10vh;text-shadow:0 0 14px rgba(255,255,255,.9)}
#scr .sc.h0{padding:0;text-shadow:none}
.sd #scr{-webkit-mask-image:linear-gradient(180deg,transparent 1%,#000 9%,#000 97%,transparent);mask-image:linear-gradient(180deg,transparent 1%,#000 9%,#000 97%,transparent)}
.rv{opacity:0;transform:translateY(26px);filter:blur(4px);transition:opacity 1s,transform 1s,filter 1s}.rv.in{opacity:1;transform:none;filter:none}
.hd2{font:400 clamp(44px,12vw,58px)/1.05 "Great Vibes",cursive;margin:4px 0 16px}.orn{width:180px;height:18px;margin:12px auto}
.cap{letter-spacing:.3em;font-size:12px;opacity:.85;margin:10px 0;color:var(--gold)}
.calw{position:relative;width:min(78vw,340px);border-radius:14px;overflow:hidden}
.cal{padding:8px 6px}.cal h3{margin:0 0 12px;font:600 26px "Cormorant Garamond",serif;color:var(--rose)}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:17px}.g7 i{font-style:normal;opacity:.6;font-size:12px;letter-spacing:.1em}
.g7 span{padding:7px 0;border-radius:50%}.g7 .ev{color:#fff;font-weight:700;background:var(--c);text-shadow:none}
.rev .ev{animation:ring 1.8s infinite}@keyframes ring{0%{box-shadow:0 0 0 0 var(--c)}70%{box-shadow:0 0 0 11px transparent}}
#scv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .9s;cursor:grab}.done #scv{opacity:0;pointer-events:none}
.lg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;min-height:28px}.lg span{padding:5px 12px;border-radius:99px;border:1px solid var(--gold);background:rgba(255,255,255,.55);font-size:15px}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.lk{background:none;border:0;color:var(--gold);font:italic 15px "Cormorant Garamond",serif;margin-top:10px;text-decoration:underline}
.cdn{display:flex;margin:18px 0}.cdn div{padding:0 16px;border-left:1px solid rgba(169,124,47,.55)}.cdn div:first-child{border-left:0}
.cdn b{display:block;font:600 46px/1 "Cormorant Garamond",serif;font-variant-numeric:tabular-nums;color:var(--rose)}.cdn small{font-size:10px;letter-spacing:.2em;opacity:.8}
.evb{margin:0 0 38px;max-width:330px}.evb .nm{font:400 50px/1.05 "Great Vibes",cursive}.evb p{margin:5px 0;font-size:20px}
.lnks{margin-top:10px}.lnks a{color:var(--rose);border-bottom:1px solid rgba(180,88,111,.6);margin:0 10px;text-decoration:none;font-size:17px;letter-spacing:.06em}
input.ul{background:none;border:0;border-bottom:1px solid rgba(74,54,64,.6);border-radius:0;color:var(--ink);text-align:center;font:22px "Cormorant Garamond",serif;width:260px;padding:8px;outline:0}input.ul::placeholder{color:rgba(74,54,64,.55)}
.stp{display:flex;align-items:center;gap:16px;margin:16px 0}.stp button{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:22px}.stp b{font-size:28px;min-width:26px}
.pill{display:inline-block;padding:11px 26px;margin:7px 0;border:1px solid var(--gold);border-radius:99px;color:var(--gold);text-decoration:none;background:rgba(255,255,255,.5);font:600 16px "Cormorant Garamond",serif;cursor:pointer;text-shadow:none}.pill.f{background:linear-gradient(180deg,#e9c585,#b88a3c);color:#2f1f08}
#scr details{border:0;border-top:1px solid rgba(74,54,64,.3);padding:13px 0;margin:0;width:100%;max-width:330px;text-align:left}#scr details:last-child{border-bottom:1px solid rgba(74,54,64,.3)}
#scr summary{cursor:pointer;font-weight:600;font-size:18px;list-style:none;display:flex;justify-content:space-between}#scr summary::after{content:"+";color:var(--gold);font-size:22px;line-height:1}#scr details[open] summary::after{content:"–"}#scr details p{font-size:17px;margin:7px 0 0}
.dua{display:none;padding:6px;max-width:330px}.dua.show{display:block}.dua .ar{font:400 30px/1.8 "Aref Ruqaa",Amiri,serif;color:var(--gold);margin:6px 0}
.hn{font-size:22px;font-weight:600;color:var(--rose);margin:9px 0}.hn small{display:block;font-size:15px;font-style:italic;font-weight:400;color:var(--ink)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
.wm{position:absolute;inset:0;z-index:12;pointer-events:none;display:flex;align-items:center;justify-content:center;font:700 64px "Cormorant Garamond",serif;letter-spacing:.2em;color:rgba(74,54,64,.08);transform:rotate(-28deg)}
@media (prefers-reduced-motion:reduce){#art,#ht>*,#sh{animation:none;opacity:1}.rv{transition:none;opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<div id="app">
 <div id="art"><img alt="" src="https://cdn.shopify.com/s/files/1/1021/1550/8503/files/blush-garden-original-artwork.jpg?v=1794962670"><div id="ht"></div></div>
 <div id="scr"></div><div id="sh">SCROLL ▾</div>
 <canvas id="fx"></canvas><div class="wm" id="wm">SAMPLE</div>
</div>
<script>
/* Inviteora central editor payload: UTF-8 Base64 JSON in the URL fragment. */
const INVITEORA_PAYLOAD=(()=>{
  try{
    const token=location.hash.slice(1).split("&")[0];
    if(!token) return null;
    const normalized=token.replace(/-/g,"+").replace(/_/g,"/");
    const padded=normalized+"=".repeat((4-normalized.length%4)%4);
    const bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(bytes));
  }catch(_){return null}
})();
const validPayload=!!(INVITEORA_PAYLOAD&&typeof INVITEORA_PAYLOAD.final==="boolean"&&
  INVITEORA_PAYLOAD.C&&typeof INVITEORA_PAYLOAD.C==="object"&&
  typeof INVITEORA_PAYLOAD.C.groom==="string"&&typeof INVITEORA_PAYLOAD.C.bride==="string"&&
  Array.isArray(INVITEORA_PAYLOAD.C.events)&&INVITEORA_PAYLOAD.C.events.length>0&&
  INVITEORA_PAYLOAD.C.events.every(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date||"")&&e.name));
if(!validPayload){
  document.documentElement.dataset.inviteoraPayload="error";
  document.body.innerHTML='<main style="min-height:100dvh;display:grid;place-items:center;padding:28px;text-align:center;background:#f9f8f3;color:#4a3640;font:20px Georgia,serif"><div><h1>Invitation unavailable</h1><p>Invitation payload is missing or incomplete. Please reopen this design from the Inviteora editor.</p></div></main>';
  throw new Error("Inviteora invitation payload is missing or invalid");
}
const C={
  ...INVITEORA_PAYLOAD.C,
  sample:!INVITEORA_PAYLOAD.final,
  rsvp:"",
  faq:Array.isArray(INVITEORA_PAYLOAD.C.faq)?INVITEORA_PAYLOAD.C.faq:[],
  hosts:Array.isArray(INVITEORA_PAYLOAD.C.hosts)?INVITEORA_PAYLOAD.C.hosts:[],
  events:INVITEORA_PAYLOAD.C.events.map(e=>({
    name:String(e.name||""),hosts:String(e.hosts||""),date:String(e.date||""),
    time:String(e.time||"19:00"),timeText:String(e.timeText||e.time||""),
    venue:String(e.venue||""),address:String(e.address||""),
    dress:String(e.dress||""),map:String(e.map||[e.venue,e.address].filter(Boolean).join(" "))
  }))
};
const CODE="blush-garden";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s),app=$("#app"),scr=$("#scr");
const M=["January","February","March","April","May","June","July","August","September","October","November","December"],D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const IC={c:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',t:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>',p:'<svg viewBox="0 0 24 24"><path d="M12 21s6.5-5.6 6.5-11A6.5 6.5 0 0 0 5.5 10C5.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg>'};
const fd=e=>{const[y,m,d]=e.date.split("-").map(Number);return D[new Date(y,m-1,d).getDay()]+", "+d+" "+M[m-1]+" "+y};
function gcal(e){const p=n=>String(n).padStart(2,"0"),[y,m,d]=e.date.split("-").map(Number),[h,mi]=e.time.split(":").map(Number),f=t=>`${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}T${p(t.getHours())}${p(t.getMinutes())}00`;
 return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(`${esc(e.name)}: ${C.groom} & ${C.bride}`)+"&dates="+f(new Date(y,m-1,d,h,mi))+"/"+f(new Date(y,m-1,d,h+3,mi))+"&location="+encodeURIComponent(e.venue+", "+e.address)}
const e0=C.events[0];
/* hero text sits inside the picture frame */
const u=()=>app.style.setProperty("--u",($("#art").offsetWidth/896)+"px");u();addEventListener("resize",u);
const fz=n=>`font-size:calc(var(--u,.5px)*${n})`;
$("#ht").innerHTML=`<div class="ar fg" style="${fz(38)};animation-delay:.9s;white-space:nowrap">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div class="it" style="${fz(27)};margin:2px 0 6px;animation-delay:1.3s">Together with the blessing of Allah</div><div class="script fn" style="${fz(96)};animation-delay:1.7s">${esc(C.groom)}</div><div class="script fg" style="${fz(52)};animation-delay:2s">&amp;</div><div class="script fn" style="${fz(96)};animation-delay:2.3s">${esc(C.bride)}</div><div class="it" style="${fz(27)};line-height:1.3;margin-top:8px;animation-delay:2.8s">request the honour of your presence<br>at their wedding</div>`;
const hero='<section class="sc h0"></section>';
const PD=e=>e.date.split("-").map(Number),CL={mehndi:"#e8742a",mayun:"#e8b400",dholki:"#e8742a",nikah:"#1f8a5b",baraat:"#b0213a",rukhsati:"#b0213a",walima:"#d86b9a",wedding:"#b0213a"},ec=e=>CL[e.name.toLowerCase()]||"#b0213a";
const FL='<svg class="orn" viewBox="0 0 200 18"><path d="M4 9h78M118 9h78" stroke="#b8893a" stroke-width="1" fill="none"/><path d="M100 1l8 8-8 8-8-8z" fill="#b8893a"/><circle cx="88" cy="9" r="2" fill="#b8893a"/><circle cx="112" cy="9" r="2" fill="#b8893a"/></svg>';
let calS="";
if(C.scratch){const[Y0,M0]=PD(e0),sd0=new Date(Y0,M0-1,1).getDay(),nd=new Date(Y0,M0,0).getDate(),dayEv={};
 C.events.filter(e=>PD(e)[0]==Y0&&PD(e)[1]==M0).forEach(e=>dayEv[PD(e)[2]]=ec(e));
 let cal=`<div class="cal"><h3>${M[M0-1]} ${Y0}</h3><div class="g7">`+D.map(x=>`<i>${x[0]}</i>`).join("");
 for(let i=0;i<sd0;i++)cal+="<span></span>";for(let i=1;i<=nd;i++)cal+=dayEv[i]?`<span class="ev" style="--c:${dayEv[i]}">${i}</span>`:`<span>${i}</span>`;cal+="</div></div>";
 calS=`<section class="sc"><div class="cap rv">SAVE THE DATE</div><h2 class="hd2 fg rv">Scratch to reveal</h2><div class="calw rv" id="cw">${cal}<canvas id="scv"></canvas></div><div class="lg" id="lg"></div><button class="lk" id="rvl">or tap here to reveal</button></section>`}
const cdS=`<section class="sc"><div class="cap rv">COUNTING DOWN TO THE ${esc(e0.name.toUpperCase())}</div><div class="cdn rv"><div><b id="c0">00</b><small>DAYS</small></div><div><b id="c1">00</b><small>HOURS</small></div><div><b id="c2">00</b><small>MIN</small></div><div><b id="c3">00</b><small>SEC</small></div></div><div class="it rv" id="cn" style="font-size:20px">${fd(e0)} · ${e0.timeText}</div>${FL}</section>`;
const evS2=`<section class="sc"><h2 class="hd2 fg rv">The celebrations</h2>`+C.events.map(e=>`<div class="evb rv"><div class="nm fg">${esc(e.name)}</div><div class="it">${esc(e.hosts)}</div>${FL}<p>${fd(e)}</p><p>${esc(e.timeText)}</p><p><b>${esc(e.venue)}</b><br>${esc(e.address)}</p><p class="it" style="opacity:.85">Dress code: ${esc(e.dress)}</p><div class="lnks"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.map)}">Open location</a><a target="_blank" rel="noopener" href="${gcal(e)}">Add to calendar</a></div></div>`).join("")+`</section>`;
const rsvpS=C.rsvp?`<section class="sc"><h2 class="hd2 fg rv">Will you join us?</h2><input class="ul rv" id="gn" placeholder="Your name"><div class="stp rv"><button id="m1">−</button><b id="gc">1</b><button id="p1">+</button><span>guest(s)</span></div><div class="rv"><a class="pill f" id="ry" target="_blank" rel="noopener">Yes, I will be there</a></div><div class="rv"><a class="pill" id="rn" target="_blank" rel="noopener">Sorry, I can’t make it</a></div></section>`:"";
const faqS=`<section class="sc"><h2 class="hd2 fg rv">A few questions</h2><div class="rv" style="width:100%;max-width:330px">${C.faq.map(q=>`<details><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join("")}</div></section>`;
const hn=(C.hosts||[]).map(n=>{const[a,b]=n.split("|");return `<div class="hn">${esc(a.trim())}${b?`<small>${esc(b.trim())}</small>`:""}</div>`}).join("");
const endS=`<section class="sc"><div class="it rv" style="font-size:24px;font-weight:600">We pray to see you there</div><div class="script fg rv" style="font-size:54px;margin:6px 0">${esc(C.groom)} &amp; ${esc(C.bride)}</div>${FL}<button class="pill rv" id="duab">Make a dua for us</button><div class="dua" id="dua"><p class="ar">بَارَكَ اللَّهُ لَكُمَا وَبَارَكَ عَلَيْكُمَا وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ</p><div class="it" style="margin:6px 0">May Allah bless you both and join you together in goodness.</div><button class="pill" id="am">Āmīn</button><div class="it" id="amt"></div></div>${hn?`<div class="cap rv" style="margin-top:30px">${esc(C.hostsTitle||"With best compliments")}</div><div class="rv">${hn}</div>`:""}</section>`;
scr.innerHTML=hero+calS+cdS+evS2+rsvpS+faqS+endS;
const io2=new IntersectionObserver(es=>es.forEach(x=>x.target.classList.toggle("in",x.isIntersecting)),{root:scr,threshold:.15});document.querySelectorAll("#scr .rv").forEach(n=>io2.observe(n));
/* scratch to reveal the date */
if(C.scratch){const cv=document.getElementById("scv"),x=cv.getContext("2d");let cw=cv.width=cv.parentElement.offsetWidth,ch=cv.height=cv.parentElement.offsetHeight,down=false,last=null,done=false,tm=0;
 const gr=x.createLinearGradient(0,0,cw,ch);[[0,"#9a7430"],[.25,"#f4dc9a"],[.5,"#c99a46"],[.75,"#fff1c8"],[1,"#9a7430"]].forEach(a=>gr.addColorStop(a[0],a[1]));
 x.fillStyle=gr;x.fillRect(0,0,cw,ch);for(let i=0;i<900;i++){x.fillStyle="rgba(255,255,255,"+Math.random()*.2+")";x.fillRect(Math.random()*cw,Math.random()*ch,1.5,1.5)}
 x.fillStyle="rgba(80,50,10,.8)";x.textAlign="center";x.font="600 26px 'Cormorant Garamond',serif";x.fillText("SCRATCH HERE",cw/2,ch/2-4);x.font="italic 17px 'Cormorant Garamond',serif";x.fillText("with your finger to reveal the date",cw/2,ch/2+24);
 const chk=()=>{if(done)return;const d=x.getImageData(0,0,cw,ch).data;let c=0,n=0;for(let i=3;i<d.length;i+=64){n++;if(d[i]<128)c++}if(c/n>.42)reveal()};
 const cut=e=>{const r=cv.getBoundingClientRect(),a=e.clientX-r.left,b=e.clientY-r.top;x.globalCompositeOperation="destination-out";x.lineWidth=46;x.lineCap="round";x.beginPath();x.moveTo(last?last[0]:a,last?last[1]:b);x.lineTo(a,b);x.stroke();last=[a,b];if(Date.now()-tm>150){tm=Date.now();chk()}};
 const reveal=()=>{if(done)return;done=true;document.getElementById("cw").classList.add("done","rev");document.getElementById("rvl").style.display="none";confetti();navigator.vibrate&&navigator.vibrate([30,40,30]);
  document.getElementById("lg").innerHTML=C.events.map(e=>`<span style="--c:${ec(e)}"><i></i>${esc(e.name)} · ${PD(e)[2]} ${M[PD(e)[1]-1].slice(0,3)}</span>`).join("")};
 cv.addEventListener("pointerdown",e=>{down=true;last=null;cv.setPointerCapture(e.pointerId);cut(e)});cv.addEventListener("pointermove",e=>{if(down)cut(e)});cv.addEventListener("pointerup",()=>{down=false;last=null;chk()});
 document.getElementById("rvl").onclick=reveal}
/* countdown */
const t0=new Date(e0.date+"T"+e0.time+":00");
const tick=()=>{const d=Math.max(0,t0-Date.now()),s=Math.floor(d/1000);[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60].forEach((v,i)=>{document.getElementById("c"+i).textContent=String(v).padStart(2,"0")});if(!d)document.getElementById("cn").textContent="The celebration has begun!"};tick();setInterval(tick,1000);
/* RSVP on WhatsApp */
if(C.rsvp){let gc=1;const rv=()=>{const n=document.getElementById("gn").value.trim()||"A guest",m="Assalamu alaikum, this is "+n+". ";document.getElementById("gc").textContent=gc;
 document.getElementById("ry").href="https://wa.me/"+C.rsvp+"?text="+encodeURIComponent(m+"I will attend the "+C.groom+" & "+C.bride+" wedding with "+gc+" guest(s) in total. Jazakallah!");
 document.getElementById("rn").href="https://wa.me/"+C.rsvp+"?text="+encodeURIComponent(m+"Sorry, I will not be able to attend the "+C.groom+" & "+C.bride+" wedding. Our duas are with you.")};
 document.getElementById("gn").oninput=rv;document.getElementById("m1").onclick=()=>{gc=Math.max(1,gc-1);rv()};document.getElementById("p1").onclick=()=>{gc=Math.min(10,gc+1);rv()};rv()}
/* dua */
let n=0;$("#duab").onclick=e=>{$("#dua").classList.add("show");e.target.style.display="none"};$("#am").onclick=()=>{n++;$("#amt").textContent="Āmīn × "+n+" — Jazakallah khair"};
/* scroll: the picture softens and the hero text fades */
scr.addEventListener("scroll",()=>{const f=Math.min(1,scr.scrollTop/(innerHeight*.45));app.classList.toggle("sd",scr.scrollTop>20);$("#ht").style.opacity=1-f;$("#sh").style.opacity=1-f},{passive:true});
/* soft pink petals + confetti */
const cv=$("#fx"),cx=cv.getContext("2d");let W,H,P=[],CF=[];
function rs(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);P=[];for(let i=0;i<14;i++)P.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*5+5,v:Math.random()*.5+.3,w:Math.random()*1.2+.4,p:Math.random()*6.3,r:Math.random()*6.3,c:["#f2a9bb","#f7c9d4","#e58aa3"][i%3]})}
rs();addEventListener("resize",rs);
(function loop(){cx.clearRect(0,0,W,H);const t=Date.now()/1000;
 for(const p of P){p.y+=p.v;p.x+=Math.sin(t*p.w+p.p)*.5;p.r+=.014;if(p.y>H+16){p.y=-16;p.x=Math.random()*W}cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,.55+.4*Math.sin(t*p.w+p.p));cx.globalAlpha=.6;cx.fillStyle=p.c;cx.beginPath();cx.ellipse(0,0,p.s,p.s*.6,0,0,6.3);cx.fill();cx.restore()}
 CF=CF.filter(p=>p.l-->0);for(const p of CF){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
 requestAnimationFrame(loop)})();
function confetti(){const c=["#e8c27a","#f2a9bb","#b4586f","#1f8a5b","#fff1c8"];for(let i=0;i<90;i++)CF.push({x:W/2,y:H*.45,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,s:Math.random()*6+4,r:Math.random()*6,c:c[i%5],l:130})}
if(!C.sample)$("#wm").remove();
app.style.visibility="visible";
document.documentElement.dataset.inviteoraPayload="loaded";
</script>
</body>
</html>
