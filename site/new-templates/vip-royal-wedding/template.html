<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152e"><title>Inviteora VIP Royal Wedding</title>
<style>
:root{color-scheme:dark;--navy:#07152e;--gold:#dfbd7a;--gold2:#f5e2b4;--ink:#f9edcf}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030a18;color:var(--ink);font-family:Georgia,'Times New Roman',serif}body{display:grid;place-items:center;padding:12px}#stage{position:relative;width:min(100%,480px);height:min(94dvh,850px);min-height:590px;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#18345a 0,#091a35 48%,#030b1c 100%);border:1px solid #b88d4c;box-shadow:0 0 0 5px #07152e,0 0 35px #b78a4433;opacity:0;transition:opacity .5s}#stage.ready{opacity:1}#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72;background:#07152e}#veil{position:absolute;inset:0;background:linear-gradient(180deg,#06132b22,#06132b55 40%,#06132bdd);pointer-events:none}.frame{position:absolute;inset:13px;border:1px solid #d5b477aa;pointer-events:none}.frame:before,.frame:after{content:"✦";position:absolute;left:50%;transform:translateX(-50%);color:var(--gold);font-size:22px;text-shadow:0 0 14px #f5d99a}.frame:before{top:-13px}.frame:after{bottom:-13px}.corner{position:absolute;color:#e5c88e;font-size:27px;opacity:.85}.tl{top:18px;left:20px}.tr{top:18px;right:20px}.bl{bottom:18px;left:20px}.br{bottom:18px;right:20px}#content{position:absolute;inset:8% 9% 17%;display:grid;place-items:center;text-align:center}.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,20px);padding:8px 3%;opacity:0;visibility:hidden;transform:translateY(18px) scale(.985);transition:opacity .75s ease,transform .75s ease,visibility .75s}.scene.active{opacity:1;visibility:visible;transform:none}.eyebrow{font:600 10px/1.5 system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);margin:0}h1,h2,p{margin:0}h1{font-size:clamp(24px,6vw,39px);font-weight:500;letter-spacing:.08em;text-shadow:0 2px 14px #000}h2{font-size:clamp(24px,6vw,40px);font-weight:500;line-height:1.18;color:var(--gold2);overflow-wrap:anywhere;text-shadow:0 2px 12px #000}.amp{font-size:30px;color:var(--gold);line-height:1}.blessing,.copy{font-size:clamp(14px,3.6vw,19px);line-height:1.5;max-width:95%}.orn{font-size:35px;color:var(--gold);text-shadow:0 0 18px #e7c78388}.eventname{font-size:clamp(22px,5vw,32px);line-height:1.3;color:var(--gold2)}.rule{height:1px;width:68%;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:3px 0}.details{font-size:clamp(15px,3.8vw,20px);line-height:1.5;overflow-wrap:anywhere;max-width:100%}.venue{font-size:clamp(14px,3.5vw,18px);line-height:1.5;max-width:100%;overflow-wrap:anywhere}.small{font:11px system-ui,sans-serif;letter-spacing:.12em;color:#e7cf9f}#controls{position:absolute;bottom:4%;left:8%;right:8%;display:flex;align-items:center;gap:9px;z-index:5}button{border:1px solid #d9b779aa;background:#0a1a33ef;color:var(--gold2);border-radius:22px;padding:9px 13px;font:12px system-ui,sans-serif}button:focus-visible{outline:2px solid white;outline-offset:3px}#meter{height:3px;background:#d5bd8a44;flex:1;border-radius:5px;overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,#b88742,#ffedc4);transition:width .4s}#counter{font:10px system-ui,sans-serif;color:#ead7b2;white-space:nowrap}#sample{position:absolute;z-index:4;top:48%;left:50%;transform:translate(-50%,-50%) rotate(-27deg);font:700 clamp(36px,12vw,70px)/1 system-ui,sans-serif;letter-spacing:.15em;color:#fff;opacity:.12;pointer-events:none;display:none}#loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px;color:var(--gold2);font:14px system-ui,sans-serif}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}@media print{body{padding:0;background:white}#stage{height:100vh;width:100%;box-shadow:none}#video,#controls{display:none}#content{inset:8% 9%}.scene{display:none}.scene.active{display:flex;opacity:1;visibility:visible;transform:none}#sample{display:none!important}}
</style></head><body><main id="stage" aria-label="VIP wedding invitation"><video id="video" muted playsinline preload="metadata" controls poster="../thumbs/vip-royal-wedding.svg"><source src="vip-royal-wedding/media/vip-wedding.mp4" type="video/mp4"></video><div id="veil"></div><div class="frame"></div><span class="corner tl">❧</span><span class="corner tr">❧</span><span class="corner bl">❧</span><span class="corner br">❧</span><div id="loading">Preparing your invitation…</div><div id="sample">SAMPLE</div><div id="content"></div><nav id="controls" aria-label="Invitation controls"><button id="prev" type="button" aria-label="Previous scene">‹</button><div style="flex:1;min-width:0"><div id="meter"><div id="bar"></div></div><div id="counter">1 / 1</div></div><button id="next" type="button" aria-label="Next scene">›</button><button id="play" type="button">Play</button></nav></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),video=$('video'),content=$('content');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function decodePayload(){const raw=location.hash.slice(1);if(!raw)throw Error('Invitation payload is missing. Open this template through Inviteora preview.');const bin=atob(raw.replace(/-/g,'+').replace(/_/g,'/'));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder('utf-8').decode(bytes))}function render(P){const C=P.C||P,events=Array.isArray(C.events)?C.events:[],parts=[];parts.push('<section class="scene active"><p class="eyebrow">INVITEORA PRESENTS</p><div class="orn">✦</div><h1>Wedding Invitation</h1><p class="blessing">With the grace of Allah Almighty</p><p class="small">A ROYAL CELEBRATION</p></section>');parts.push('<section class="scene"><p class="eyebrow">THE COUPLE</p><h2>'+esc(C.groom)+'</h2><div class="amp">&amp;</div><h2>'+esc(C.bride)+'</h2><div class="orn">❧</div><p class="copy">Together with their families</p></section>');if(C.hosts||C.hostsTitle)parts.push('<section class="scene"><p class="eyebrow">'+esc(C.hostsTitle||'WITH THEIR FAMILIES')+'</p><div class="orn">✧</div><p class="copy">'+esc(C.hosts||'')+'</p></section>');events.forEach((e,i)=>{parts.push('<section class="scene"><p class="eyebrow">CELEBRATION '+(i+1)+' OF '+events.length+'</p><div class="orn">✦</div><h2 class="eventname">'+esc(e.name||'Wedding Celebration')+'</h2><div class="rule"></div><p class="details">'+esc(e.date)+'</p><p class="details">'+esc(e.timeText||e.time)+'</p><div class="rule"></div><p class="venue">'+esc(e.venue)+'</p><p class="venue">'+esc(e.address)+'</p>'+(e.dress?'<p class="small">DRESS: '+esc(e.dress)+'</p>':'')+'</section>')});parts.push('<section class="scene"><p class="eyebrow">YOUR PRESENCE IS OUR HONOUR</p><div class="orn">❦</div><h2 style="font-size:clamp(21px,5vw,31px)">We request the honour of your presence</h2><div class="rule"></div><p class="copy">Kindly RSVP</p><p class="small">WITH LOVE FROM BOTH FAMILIES</p></section>');content.innerHTML=parts.join('');$('sample').style.display=(!P.final||C.sample)?'block':'none';const scenes=[...content.querySelectorAll('.scene')];let index=0,timer=null;function show(n){index=(n+scenes.length)%scenes.length;scenes.forEach((s,i)=>s.classList.toggle('active',i===index));$('counter').textContent=(index+1)+' / '+scenes.length;$('bar').style.width=((index+1)/scenes.length*100)+'%'}function stop(){if(timer){clearInterval(timer);timer=null}$('play').textContent='Play'}function next(){show(index+1);if(index===scenes.length-1)stop()}$('prev').onclick=()=>{stop();show(index-1)};$('next').onclick=()=>{stop();next()};$('play').onclick=()=>{if(timer){stop();return}if(index===scenes.length-1)show(0);$('play').textContent='Pause';timer=setInterval(next,4300)};let sx=0;stage.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>45){stop();show(index+(dx<0?1:-1))}},{passive:true});show(0);const ready=!!(C.groom&&C.bride&&events.length&&events.every(e=>e&&e.name!==undefined&&e.date!==undefined&&e.time!==undefined&&e.venue!==undefined&&e.address!==undefined));if(!ready)throw Error('Invitation details are incomplete. Please complete the event details in Inviteora.');document.documentElement.dataset.inviteoraPayload='loaded';$('loading').remove();stage.classList.add('ready');video.addEventListener('error',()=>{video.style.display='none'});if(!video.canPlayType('video/mp4'))video.style.display='none'}try{render(decodePayload())}catch(e){$('loading').textContent=e.message;console.error(e)}})();</script></body></html>
