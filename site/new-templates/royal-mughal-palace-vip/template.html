<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><title>Royal Mughal Palace — Inviteora VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Nastaliq+Urdu:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#071326;--navy2:#102746;--gold:#d9b66f;--pale:#f4e6c2;--muted:#c6b48c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030914;color:var(--pale);font-family:'Cormorant Garamond',Georgia,serif}body{overflow:hidden}button{font:inherit}
#shell{height:100dvh;max-width:560px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 34%,#18375a 0,#0a1a31 45%,#030914 100%);isolation:isolate}
#film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.36;filter:saturate(.72) contrast(1.08);z-index:-2}
#veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,9,20,.16),rgba(4,12,25,.38) 42%,#030914 100%);z-index:-1}
#palace{position:absolute;inset:0;pointer-events:none;opacity:.88}
#palace svg{width:100%;height:100%}
#pages{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
#pages::-webkit-scrollbar{display:none}.page{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9vh 9% 13vh;gap:clamp(9px,2vh,20px);overflow:hidden}
.frame{position:absolute;inset:18px;border:1px solid rgba(217,182,111,.65);pointer-events:none}.frame:before,.frame:after{content:"";position:absolute;width:38px;height:38px;border-color:var(--gold);border-style:solid}.frame:before{top:8px;left:8px;border-width:1px 0 0 1px}.frame:after{right:8px;bottom:8px;border-width:0 1px 1px 0}
.kicker{font:11px Cinzel,serif;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}.urdu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;line-height:2.15;color:var(--pale)}.bism{font-size:clamp(22px,6vw,30px);margin-bottom:2vh}
h1,h2,p{margin:0}h1{font:clamp(28px,8vw,48px)/1.2 Cinzel,serif;letter-spacing:.08em;color:var(--pale);text-shadow:0 2px 24px #000}.names{font:clamp(36px,10vw,58px)/1.25 'Cormorant Garamond',serif;color:var(--gold);font-style:italic}.amp{font-size:30px;color:var(--pale)}.sub{font-size:clamp(17px,4.5vw,22px);color:var(--muted);line-height:1.4}.rule{width:58%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:5px 0}
.seal{width:92px;height:92px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:20px Cinzel,serif;box-shadow:0 0 0 8px #d9b66f16,0 0 34px #d9b66f30;margin-bottom:1vh}
.event-no{font:10px Cinzel,serif;letter-spacing:.35em;color:var(--gold)}.event-name{font:clamp(31px,8vw,44px) Cinzel,serif;color:var(--pale);letter-spacing:.06em}.event-date{font-size:clamp(20px,5vw,27px);color:var(--gold)}.detail{font-size:clamp(17px,4.5vw,21px);line-height:1.35;color:#eadfc6}.detail small{display:block;font-size:.82em;color:var(--muted);margin-top:5px}
.art{width:min(72vw,300px);height:clamp(130px,24vh,205px);margin:0 auto 1vh;filter:drop-shadow(0 14px 28px #0008)}
.art svg{width:100%;height:100%}.scene-glow{animation:glow 4s ease-in-out infinite alternate;transform-origin:center}@keyframes glow{to{opacity:.35;filter:blur(2px)}}.float{animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}
#controls{position:absolute;z-index:8;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px}
.ctrl{border:1px solid #d9b66f99;background:#071326cc;color:var(--pale);border-radius:30px;padding:10px 18px;font:11px Cinzel,serif;letter-spacing:.12em;backdrop-filter:blur(8px)}
#count{font:10px Cinzel,serif;letter-spacing:.15em;color:var(--gold);min-width:40px;text-align:center}
#open{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 25px max(13vh,70px);gap:14px;text-align:center;background:linear-gradient(180deg,#03091422 15%,#030914d9 100%);transition:opacity .9s}
#open.hide{opacity:0;pointer-events:none}.doors{position:absolute;inset:0;display:flex;z-index:-1;overflow:hidden}.door{width:50%;height:100%;background:linear-gradient(90deg,#061020,#18304d 50%,#061020);border:2px solid #b58b4e;box-shadow:inset 0 0 45px #000;transition:transform 2s cubic-bezier(.2,.7,.1,1)}.door:first-child{border-right:1px solid var(--gold)}.door:last-child{border-left:1px solid var(--gold)}#open.hide .door:first-child{transform:translateX(-105%)}#open.hide .door:last-child{transform:translateX(105%)}
#open button{border:1px solid var(--gold);background:#0b1b31;color:var(--pale);padding:14px 25px;border-radius:30px;font:12px Cinzel,serif;letter-spacing:.2em;box-shadow:0 0 30px #d9b66f22}
#wm{position:absolute;inset:0;z-index:7;pointer-events:none;display:grid;place-items:center;overflow:hidden}#wm:before{content:"SAMPLE";font:700 12vw Cinzel,serif;letter-spacing:.2em;color:#fff2;transform:rotate(-28deg);text-shadow:0 1px 3px #0008}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}
@media(min-width:700px){#shell{height:min(94dvh,960px);margin:3dvh auto;border:1px solid #b58b4e66;box-shadow:0 25px 100px #000}}
</style></head><body><main id="shell"><video id="film" playsinline muted loop preload="metadata"><source src="/templates/vip-royal-wedding/media/vip-wedding.mp4" type="video/mp4"></video><div id="veil"></div>
<div id="palace" aria-hidden="true"><svg viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f5dfa5"/><stop offset="1" stop-color="#9c7138"/></linearGradient><radialGradient id="halo"><stop stop-color="#f5d998" stop-opacity=".38"/><stop offset="1" stop-color="#f5d998" stop-opacity="0"/></radialGradient></defs><ellipse cx="210" cy="360" rx="190" ry="260" fill="url(#halo)"/><g fill="none" stroke="url(#g)" opacity=".68"><path d="M34 900V350Q34 120 210 74Q386 120 386 350V900M56 900V360Q56 150 210 108Q364 150 364 360V900" stroke-width="2"/><path d="M100 900V390Q100 230 210 192Q320 230 320 390V900M120 900V400Q120 255 210 220Q300 255 300 400V900" stroke-width="1.4"/><path d="M18 590h384M18 610h384M210 74v-40m-16 20h32" stroke-width="1"/><path d="M34 360q-18-22 0-44 18 22 0 44M386 360q-18-22 0-44 18 22 0 44" /></g><g fill="#d9b66f" opacity=".8"><circle cx="210" cy="74" r="4"/><circle cx="34" cy="350" r="3"/><circle cx="386" cy="350" r="3"/></g></svg></div>
<div id="pages"></div><div id="controls"><button class="ctrl" id="prev">PREVIOUS</button><span id="count">01 / 01</span><button class="ctrl" id="next">CONTINUE</button></div>
<div id="open"><div class="doors"><div class="door"></div><div class="door"></div></div><div class="seal">IM</div><p class="kicker">A ROYAL CELEBRATION</p><p class="urdu">دعوت نامہ کھولنے کے لیے ٹیپ کریں</p><button id="begin">OPEN THE PALACE</button></div><div id="wm" hidden></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), pages=$('pages'), film=$('film');
const s=v=>v==null?'':String(v).trim(), esc=v=>s(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ar=/[\u0600-\u06FF]/;
function decode(){let x=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');if(!x)throw Error('Open this invitation through Inviteora preview.');while(x.length%4)x+='=';const b=atob(x);return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))))}
const P=decode(),C=P.C||P,events=Array.isArray(C.events)?C.events:[];
if(!s(C.groom)||!s(C.bride)||!events.length)throw Error('Please complete the couple names and event details in Inviteora.');
const sample=P.final!==true||C.sample===true;$('wm').hidden=!sample;
const date=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s(d));return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}):s(d)};
function art(kind){const common='<defs><linearGradient id="ag" x2="0" y2="1"><stop stop-color="#f5dfa5"/><stop offset="1" stop-color="#a87937"/></linearGradient></defs>';
let body='';
if(/mehndi|mayun|dholki/i.test(kind))body='<path d="M65 180Q210 5 355 180M85 180Q210 35 335 180" fill="none" stroke="url(#ag)" stroke-width="5"/><g fill="#d9b66f"><circle cx="105" cy="118" r="12"/><circle cx="150" cy="80" r="10"/><circle cx="210" cy="55" r="13"/><circle cx="270" cy="80" r="10"/><circle cx="315" cy="118" r="12"/></g><path d="M90 190q120 65 240 0" fill="none" stroke="#d9b66f" stroke-width="2"/>';
else if(/baraat|barat|nikah|nikkah|rukhsat/i.test(kind))body='<path d="M55 190V95Q55 20 210 20Q365 20 365 95V190M85 190V100Q85 50 210 50Q335 50 335 100V190" fill="none" stroke="url(#ag)" stroke-width="6"/><path d="M135 190V120Q135 80 210 80Q285 80 285 120V190" fill="none" stroke="#d9b66f" stroke-width="3"/><path d="M190 190v-45q20-35 40 0v45" fill="none" stroke="#f5dfa5" stroke-width="3"/>';
else body='<path d="M55 190V85L105 35 155 85V190M265 190V85L315 35 365 85V190M105 190V115Q210 5 315 115V190" fill="none" stroke="url(#ag)" stroke-width="5"/><g fill="#d9b66f"><circle cx="210" cy="70" r="5"/><circle cx="105" cy="35" r="5"/><circle cx="315" cy="35" r="5"/></g>';
return '<svg viewBox="0 0 420 220" role="img" aria-label="Mughal palace celebration artwork">'+common+body+'</svg>'}
function block(cls,txt){return '<p class="'+cls+'">'+txt+'</p>'}
function page(markup){const d=document.createElement('section');d.className='page';d.innerHTML='<div class="frame"></div>'+markup;pages.appendChild(d)}
page(block('bism urdu','بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ')+block('kicker','WITH THE BLESSINGS OF ALLAH ALMIGHTY')+block('seal','✦')+block('sub','Together with our families')+block('names',esc(C.groom))+block('amp','&')+block('names',esc(C.bride))+'<div class="rule"></div>'+block('sub','request the honour of your presence at their wedding celebrations')+block('urdu','آپ کی شرکت ہمارے لیے باعثِ مسرت ہوگی'));
const hosts=Array.isArray(C.hosts)?C.hosts:[];
if(hosts.length){let h=hosts.map(x=>{const n=typeof x==='object'?s(x.name):s(x).split('|')[0],r=typeof x==='object'?s(x.relation):s(x).split('|')[1]||'';return n?'<p class="detail">'+esc(n)+(r?'<small>'+esc(r)+'</small>':'')+'</p>':''}).join('');page(block('kicker',esc(C.hostsTitle||'WITH BEST COMPLIMENTS'))+h)}
events.forEach((e,i)=>{const name=s(e.name)||'Wedding Celebration';const kind=/mehndi|mayun|dholki/i.test(name)?'MEHNDI':'CELEBRATION';const type=/baraat|barat/i.test(name)?'BARAAT':(/walima/i.test(name)?'WALIMA':kind);page('<div class="event-no">CHAPTER '+String(i+1).padStart(2,'0')+' · '+type+'</div><div class="art float">'+art(name)+'</div>'+block('event-name',esc(name))+'<div class="rule"></div>'+block('event-date',esc(date(e.date)))+block('detail',esc(e.timeText||e.time))+block('detail',esc(e.venue))+(e.address?block('detail',esc(e.address)):'')+(e.hosts?block('detail',esc(e.hosts)):'')+(e.dress?block('detail','Dress code · '+esc(e.dress)):'')+(e.map?'<a class="ctrl" target="_blank" rel="noopener" href="'+esc(/^https?:\/\//i.test(e.map)?e.map:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((e.venue||'')+' '+e.address))+'">VIEW LOCATION</a>':'') )});
const R=C.rsvp&&typeof C.rsvp==='object'?C.rsvp:{};page(block('seal','✦')+block('kicker','UNTIL WE MEET')+block('names',esc(C.groom)+' &amp; '+esc(C.bride))+block('sub','Your presence will make our celebration complete')+(R.phone?'<a class="ctrl" target="_blank" rel="noopener" href="https://wa.me/'+esc(s(R.phone).replace(/\D/g,''))+'?text='+encodeURIComponent('Assalamu Alaikum, I will attend the wedding of '+s(C.groom)+' & '+s(C.bride))+'">RSVP ON WHATSAPP</a>':'')+block('kicker','INVITEORA · ROYAL MUGHAL PALACE'));
let idx=0;function update(){const w=pages.clientWidth;pages.scrollTo({left:idx*w,behavior:'smooth'});$('count').textContent=String(idx+1).padStart(2,'0')+' / '+String(pages.children.length).padStart(2,'0');$('prev').disabled=idx===0;$('next').textContent=idx===pages.children.length-1?'REPLAY':'CONTINUE'}
$('prev').addEventListener('click',()=>{idx=Math.max(0,idx-1);update()});$('next').addEventListener('click',()=>{if(idx===pages.children.length-1){idx=0;film.currentTime=0;film.play().catch(()=>{})}else idx++;update()});
$('begin').addEventListener('click',()=>{$('open').classList.add('hide');film.play().catch(()=>{});update()});
let sx=0;pages.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});pages.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45){idx=Math.max(0,Math.min(pages.children.length-1,idx+(dx<0?1:-1)));update()}},{passive:true});
pages.addEventListener('scroll',()=>{const n=Math.round(pages.scrollLeft/Math.max(1,pages.clientWidth));if(n!==idx){idx=n;$('count').textContent=String(idx+1).padStart(2,'0')+' / '+String(pages.children.length).padStart(2,'0')}},{passive:true});
window.addEventListener('resize',update);document.documentElement.dataset.inviteoraPayload='loaded';update();
})();
</script></main></body></html>
