<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06251d"><title>Inviteora | Emerald Mughal Wedding</title>
<style>
:root{--gold:#d9b66e;--cream:#fff1c9;--green:#06251d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#061b15;color:var(--cream)}
body{font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:0}
.invite{position:relative;width:min(100vw,430px);aspect-ratio:9/16;max-height:100svh;overflow:hidden;background:#06251d;isolation:isolate;box-shadow:0 18px 60px #0009}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:-2}
.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#00130d08 0%,#00130d12 35%,#00130d1a 72%,#00130d12 100%);pointer-events:none}
.content{position:absolute;inset:12.3% 14.5% 10.3%;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:flex-start;padding:0 2px;text-shadow:0 2px 7px #00130d;overflow:auto;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.lang{position:absolute;z-index:6;top:6.3%;right:9%;border:1px solid #e5c47d;background:#08271f;color:#ffe9b3;border-radius:22px;padding:7px 12px;font:11px Arial;cursor:pointer}
.bism{font-size:clamp(13px,3.4vw,17px);line-height:1.4;color:#f5d88f;margin:0 0 7px}
.eyebrow{font:clamp(8px,2vw,10px) Arial;letter-spacing:2.5px;color:#e9cb87;margin:0 0 11px}
.title{font-size:clamp(22px,6.2vw,31px);font-weight:400;line-height:1.05;color:#ffe5a5;margin:0 0 8px}
.names{font-size:clamp(27px,7vw,37px);line-height:1.08;color:#f5d18a;margin:0}
.amp{display:block;font-size:18px;margin:2px 0;color:#fff0c9}
.copy{font:clamp(10px,2.5vw,12px)/1.45 Arial,sans-serif;max-width:270px;margin:8px auto;color:#fff0d2}
.orn{color:#e5c17a;font-size:18px;margin:1px 0 5px}
.details{display:grid;grid-template-columns:1fr;gap:5px;width:100%;margin:2px 0 7px}
.detail{padding:5px 5px;border-top:1px solid #d5b46a99;border-bottom:1px solid #d5b46a99;background:#06251d66}
.detail b{display:block;font:8px Arial;letter-spacing:2px;color:#e6c67e;margin-bottom:3px}
.detail span{display:block;font-size:clamp(11px,2.7vw,14px);line-height:1.22;overflow-wrap:anywhere}
.detail a{display:inline-block;color:#ffe5a5;text-decoration:none;font:8px Arial;letter-spacing:.8px;margin-top:4px;border-bottom:1px solid #e5c47d88}
.closing{font-size:clamp(11px,2.7vw,14px);font-style:italic;line-height:1.25;margin:2px 0 6px}
.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;width:100%}
.actions a,.actions button{border:1px solid #e4c176;background:linear-gradient(#f6d990,#c99a42);color:#09251c;border-radius:22px;padding:7px 10px;font:700 8px Arial;letter-spacing:.45px;text-decoration:none;cursor:pointer;white-space:nowrap}
.actions .secondary{background:#06251dcc;color:#ffedc1}
.footer{font:6.5px Arial;letter-spacing:1.35px;color:#e9cc8a;margin-top:6px;line-height:1.3}
.parents{font:9px/1.3 Arial,sans-serif;color:#fff0d2;margin:4px 0 0}
.parents strong{color:#e6c67e;font-weight:normal}
.sample-watermark{display:none;position:absolute;z-index:4;left:50%;top:51%;transform:translate(-50%,-50%) rotate(-23deg);font:700 clamp(16px,4vw,21px) Arial;letter-spacing:4px;color:#fff9;border:2px solid #fff8;padding:5px 12px;opacity:.28;pointer-events:none;text-shadow:0 2px 7px #000}
.sample-watermark.show{display:block}
.error{position:absolute;inset:20% 10%;display:grid;place-items:center;text-align:center;font:14px/1.6 Arial,sans-serif;color:#ffe5a5}
.rtl{direction:rtl}.rtl .eyebrow,.rtl .detail b{letter-spacing:0}.rtl .copy,.rtl .parents{font-family:Arial,sans-serif}
@media(max-height:720px){.content{inset:11.5% 14.5% 9%}.bism{margin-bottom:4px}.eyebrow{margin-bottom:7px}.title{margin-bottom:5px}.copy{margin:5px auto}.details{gap:3px}.detail{padding:4px}.closing{margin:1px 0 4px}.footer{margin-top:4px}}
@media(max-width:350px){.content{inset-left:13%;inset-right:13%}.names{font-size:25px}.actions{gap:4px}.actions a,.actions button{font-size:7px;padding:6px 8px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="invite" id="invite" data-ready="false">
<img class="bg" id="bg" alt="Original emerald and gold Mughal wedding artwork" src="https://cdn.shopify.com/s/files/1/1021/1550/8503/files/inviteora-emerald-original-mughal-background.jpg?v=1794938992">
<div class="shade"></div><div class="sample-watermark" id="sample-watermark">SAMPLE</div>
<button class="lang" id="lang" type="button">اردو</button>
<section class="content" id="content">
<div class="bism" id="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
<div class="eyebrow" data-en="WITH THE BLESSINGS OF ALLAH" data-ur="اللہ کے فضل و کرم سے">WITH THE BLESSINGS OF ALLAH</div>
<h1 class="title" data-en="Wedding Invitation" data-ur="دعوتِ شادی">Wedding Invitation</h1>
<div class="names"><span id="bride-name"> </span><span class="amp">&amp;</span><span id="groom-name"> </span></div>
<p class="copy" id="invite-copy" data-en="Together with our families, we joyfully invite you to celebrate our wedding." data-ur="ہم اپنے اہلِ خانہ کے ساتھ آپ کو اپنی خوشیوں میں شرکت کی دعوت دیتے ہیں۔">Together with our families, we joyfully invite you to celebrate our wedding.</p>
<div class="orn">✦ ❧ ✦</div>
<div class="details" id="details"></div>
<div class="parents" id="parents"></div>
<p class="closing" id="closing" data-en="Your presence will make our day more memorable." data-ur="آپ کی تشریف آوری ہمارے لیے باعثِ مسرت ہوگی۔">Your presence will make our day more memorable.</p>
<div class="actions"><a id="rsvp" href="#" target="_blank" rel="noopener">RSVP ON WHATSAPP</a><button class="secondary" id="share" type="button">SHARE INVITATION</button></div>
<div class="footer" data-en="WE LOOK FORWARD TO CELEBRATING WITH YOU" data-ur="آپ کی آمد کے منتظر">WE LOOK FORWARD TO CELEBRATING WITH YOU</div>
</section>
</main>
<script>
(()=>{
 const root=document.getElementById('invite'), content=document.getElementById('content');
 const $=id=>document.getElementById(id);
 let payload, C={}, ur=false;
 function fail(message){root.dataset.ready='true';content.innerHTML='<div class="error">'+message+'</div>';document.documentElement.dataset.inviteoraPayload='error';}
 function decode(){try{const raw=location.hash.slice(1);if(!raw)throw new Error('Invitation payload is missing. Please open this invitation from the Inviteora preview or editor.');payload=JSON.parse(decodeURIComponent(escape(atob(raw))));C=payload.C||{};if(!C.bride||!C.groom||!Array.isArray(C.events)||!C.events.length)throw new Error('Invitation details are incomplete. Please return to the Inviteora editor and add the couple names and at least one event.');}catch(e){fail(e.message);return false;}return true;}
 const dateFmt=v=>{if(!v)return'';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat(ur?'ur-PK':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)};
 const safe=(v)=>String(v??'').trim();
 function render(){
  $('bride-name').textContent=safe(C.bride);$('groom-name').textContent=safe(C.groom);
  const events=C.events.filter(e=>e&& (e.name||e.date||e.timeText||e.venue||e.address));
  const details=$('details');details.replaceChildren();
  const labels=ur?['تقریب','تاریخ','وقت','مقام']:['EVENT','DATE','TIME','VENUE'];
  events.forEach((e,i)=>{
   const card=document.createElement('div');card.className='detail';
   const head=document.createElement('b');head.textContent=events.length>1?(safe(e.name)||`${labels[0]} ${i+1}`):labels[0];card.append(head);
   const bits=[];
   if(e.date)bits.push([labels[1],dateFmt(e.date)]);
   if(e.timeText||e.time)bits.push([labels[2],safe(e.timeText||e.time)]);
   if(e.venue||e.address)bits.push([labels[3],[safe(e.venue),safe(e.address)].filter(Boolean).join(', ')]);
   bits.forEach(([label,value])=>{const line=document.createElement('span');line.textContent=events.length>1?`${label}: ${value}`:value;card.append(line)});
   if(e.map||e.venue||e.address){const map=document.createElement('a');map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.map||[e.venue,e.address].filter(Boolean).join(' '));map.target='_blank';map.rel='noopener';map.textContent=ur?'گوگل میپس پر مقام دیکھیں':'OPEN LOCATION IN GOOGLE MAPS';card.append(map)}
   details.append(card);
  });
  const parents=[];if(C.brideParents)parents.push((ur?'دلہن کے والدین: ':'Bride’s family: ')+safe(C.brideParents));if(C.groomParents)parents.push((ur?'دلہا کے والدین: ':'Groom’s family: ')+safe(C.groomParents));
  $('parents').textContent=parents.join('  •  ');$('parents').hidden=!parents.length;
  const phone=safe(C.rsvpWhatsapp||C.whatsapp||C.contactWhatsapp).replace(/[^0-9]/g,'');
  const msg=encodeURIComponent(`Assalam-o-Alaikum, I would like to RSVP for ${safe(C.bride)} & ${safe(C.groom)}'s wedding.`);
  $('rsvp').href=phone?`https://wa.me/${phone}?text=${msg}`:`https://wa.me/?text=${msg}`;
  $('sample-watermark').classList.toggle('show',payload.final!==true||C.sample===true);
  root.dataset.ready='true';document.documentElement.dataset.inviteoraPayload='loaded';
 }
 if(decode())render();
 $('lang').addEventListener('click',()=>{ur=!ur;document.documentElement.lang=ur?'ur':'en';content.dir=ur?'rtl':'ltr';content.classList.toggle('rtl',ur);document.querySelectorAll('[data-en]').forEach(el=>el.textContent=ur?el.dataset.ur:el.dataset.en);$('lang').textContent=ur?'English':'اردو';render();});
 $('share').addEventListener('click',async()=>{const data={title:'Wedding Invitation',text:`You are invited to celebrate ${safe(C.bride)} & ${safe(C.groom)}'s wedding.`,url:location.href};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);$('share').textContent=ur?'لنک کاپی ہوگیا':'LINK COPIED';}}catch(e){}});
})();
</script>
</body></html>
