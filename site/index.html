<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retail Hub – Digital Wedding Invitations</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#17110d;--card:#241b14;--line:#4a3a28;--gold:#d2ad66;--ink:#f6ead0;--mut:#bfae8e}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 19px/1.3 'Cormorant Garamond',Georgia,serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:34px;font-style:italic;font-weight:600;margin:6px 0 4px}h2{font-size:24px;color:var(--gold);margin:22px 0 6px;font-weight:600}
p.s{color:var(--mut);margin:0 0 18px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.c img{width:100%;aspect-ratio:9/12;object-fit:cover;object-position:top;display:block}
.c div{padding:12px 14px 14px}.c b{font-size:22px;display:block}.c span{color:var(--mut);font-size:16px;display:block;margin:2px 0 10px}
button,.b{font:600 17px 'Cormorant Garamond',Georgia,serif;border:1px solid var(--gold);background:var(--gold);color:#241808;border-radius:30px;padding:10px 18px;cursor:pointer}
.b.o,button.o{background:transparent;color:var(--gold)}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.tabs button.on{background:var(--gold);color:#241808}.tabs button:not(.on){background:transparent;color:var(--gold)}
label{display:block;font-size:15px;color:var(--mut);margin:10px 0}
input,select{display:block;width:100%;margin-top:4px;padding:11px;border-radius:9px;border:1px solid #75664d;background:#261f18;color:#fff;font:16px system-ui}
fieldset{border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:6px 12px 12px}legend{color:var(--gold);padding:0 6px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fr{width:min(100%,360px);aspect-ratio:9/16;margin:8px auto;border:6px solid #3a2c1c;border-radius:26px;overflow:hidden;background:#000}.fr iframe{width:100%;height:100%;border:0}
.act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.h{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.chips button{white-space:nowrap;padding:7px 14px;font-size:16px}.chips button:not(.on){background:transparent;color:var(--gold)}
.c .bd{display:inline-block;font-size:14px;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:1px 9px;margin:0 0 6px}.em{grid-column:1/-1;text-align:center;color:var(--mut);padding:26px 8px}
</style></head><body><div class="w">
<div id="gal"><h1>Digital wedding invitations</h1><p class="s">Pick a design, add your names and events, see your live card, then order on WhatsApp.</p><div class="chips" id="occ"></div><div class="chips" id="tier"></div><div class="g" id="grid"></div></div>
<div id="stu" class="h"><button class="o" id="back">← All designs</button><h1 id="tt"></h1>
<div class="tabs"><button id="t1" class="on">1. Details</button><button id="t2">2. Preview</button></div>
<div id="pd"><div id="f"></div><div class="act"><button id="add" class="o">+ Add event</button><button id="show">Show my card</button></div></div>
<div id="pp" class="h"><div class="fr"><iframe id="ifr" title="Card preview"></iframe></div><div class="act"><button id="ord">Order on WhatsApp</button><button class="o" id="edit">Edit details</button><button class="o h" id="own">Copy final link</button></div><p class="s" id="preview-note" style="text-align:center">The SAMPLE mark is removed from your final card after payment.</p></div></div>
</div>
<script>
const WA='923392112657';
const API='https://pvunxonsskcczghqivpl.supabase.co/functions/v1/invitations-api';
const API_KEY='sb_publishable_Nbb-PCKF_qxYCfvMwX8b9w_MttixP9P';
let T=[],OC=[],TR=[],fo='all',ft='all';
const $=s=>document.querySelector(s);
const SE={title:'Ali’s Birthday Dinner',host:'Hosted by the Khan family',close:'We would love to have you with us.',ev:[{k:'Dinner',hosts:'',d:'2027-03-20',t:'20:00',v:'Khan Residence',a:'Johar Town, Lahore'}]};
const SW={groom:'Mahad',bride:'Laiba',gf:'Mr. & Mrs. Qasim',bf:'Mr. & Mrs. Naseem',close:'Your prayers and presence mean the world to us. Please make a dua for us.',ev:[
{k:'Mehndi',hosts:'Hosted by the bride’s family',d:'2027-03-06',t:'19:30',v:'Rana Farm House',a:'Canal Road, Lahore'},
{k:'Nikah',hosts:'Laiba & Mahad',d:'2027-03-07',t:'16:00',v:'Jamia Masjid',a:'Gulberg III, Lahore'},
{k:'Walima',hosts:'Hosted by the groom’s family',d:'2027-03-09',t:'19:30',v:'Pearl Continental',a:'Mall Road, Lahore'}]};
let cur=null,S=SW;
const tn=id=>(TR.find(x=>x.id===id)||{}).name||'';
const f12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')};
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const kind=k=>{k=k.toLowerCase();return/mayun|haldi|dholki/.test(k)?['yellow','#5a3a00',[15,35,70,50]]:/mehndi|mehendi/.test(k)?['mehndi','#6b2d12',[7,31,52,44]]:/nikah|nikkah|milad/.test(k)?['green','#f3dfa2',[14,25,34,62],1,'#0d4a2c']:/baraat|barat|rukhsa/.test(k)?['burgundy','#5b0f1f',[7.5,12,32,76],1]:['pink','#6e3a45',[11,27,64,52]]};
const ad=t=>AD[t.ad]||AD.std;
const AD={
std:(s,fin)=>({final:fin,d:{...s,kind:cur.form==='event'?'event':'wedding'}}),
mahad:(s,fin)=>({final:fin,C:{a:s.groom,b:s.bride,fam:[[s.gf,'parents of the groom'],[s.bf,'parents of the bride']],close:s.close},EV:s.ev.map(e=>{const q=kind(e.k);return{k:e.k,who:e.hosts,d:e.d,t:f12(e.t),v:e.v,a:e.a,bg:q[0],c:q[1],box:q[2],nar:q[3],bgc:q[4]}})}),
ivory:(s,fin)=>({final:fin,C:{groom:s.groom,bride:s.bride,events:s.ev.map(e=>({name:e.k,hosts:e.hosts,date:e.d,time:e.t||'19:00',timeText:f12(e.t),venue:e.v,address:e.a,dress:'Festive formal',map:e.v+' '+e.a,bg:/nikah|milad/i.test(e.k)?'b-night':'b-plum'}))}}),
velvet:(s,fin)=>({final:fin,C:{groom:s.groom,bride:s.bride,sample:!fin,events:s.ev.map(e=>({name:e.k,hosts:e.hosts,date:e.d,time:e.t||"19:00",timeText:f12(e.t),venue:e.v,address:e.a,dress:"Festive formal",map:e.v+" "+e.a}))}})
};
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const link=fin=>new URL(cur.file,location.href).href+'#'+b64(ad(cur)(S,fin));
function grid(){const bt=(l,k,v)=>`<button data-${k}="${v}" class="${(k==='o'?fo:ft)===v?'on':''}">${l}</button>`;
$('#occ').innerHTML=bt('All occasions','o','all')+OC.map(o=>bt(o.name,'o',o.id)).join('');
$('#tier').innerHTML=bt('Any style','r','all')+TR.map(o=>bt(o.name+(o.price?' · '+o.price:''),'r',o.id)).join('');
const L=T.filter(t=>(fo==='all'||t.occasion===fo)&&(ft==='all'||t.tier===ft));
$('#grid').innerHTML=L.length?L.map(t=>`<div class="c"><img src="${t.thumb}" alt="${t.name}"><div><span class="bd">${tn(t.tier)}</span><b>${t.name}</b><span>${t.tag}</span><button data-t="${t.id}">Preview &amp; customise</button></div></div>`).join(''):`<div class="em">Designs for this category are being made.<br><br><button id="ask">Ask for this design on WhatsApp</button></div>`}
$('#occ').onclick=e=>{const b=e.target.closest('[data-o]');if(b){fo=b.dataset.o;grid()}};
$('#tier').onclick=e=>{const b=e.target.closest('[data-r]');if(b){ft=b.dataset.r;grid()}};
$('#grid').onclick=e=>{const b=e.target.closest('[data-t]');if(b)location.hash='studio='+b.dataset.t;if(e.target.id==='ask'){const o=OC.find(x=>x.id===fo),r=TR.find(x=>x.id===ft);open('https://wa.me/'+WA+'?text='+encodeURIComponent('Assalamualaikum! I am looking for an invitation card.\nOccasion: '+(o?o.name:'any')+'\nStyle: '+(r?r.name:'any')),'_blank')}};
async function route(){
 const previewToken=new URLSearchParams(location.search).get('preview');
 if(previewToken){
  $('#gal').classList.add('h');$('#stu').classList.remove('h');$('#pd').classList.add('h');$('#pp').classList.remove('h');$('#tt').textContent='Invitation preview';$('#ifr').src='about:blank';
  try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY},body:JSON.stringify({action:'verify-preview',token:previewToken})});const out=await res.json();if(!res.ok||!out.valid)throw new Error('Preview link expired. Please create a new preview.');
   const t=T.find(x=>x.id===out.template_id);if(!t)throw new Error('This invitation design is unavailable.');cur=t;$('#tt').textContent=t.name+' — Trial Preview';$('#ifr').src=t.file+'#'+b64(out.invitation);$('#ord').disabled=true;$('#edit').classList.add('h');$('#own').classList.add('h');
   const left=Math.max(0,Math.ceil((new Date(out.expires_at).getTime()-Date.now())/1000));$('#preview-note').textContent='Trial preview · '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+' remaining';window.clearTimeout(window.previewExpiryTimer);window.previewExpiryTimer=window.setTimeout(()=>{$('#ifr').src='about:blank';$('#tt').textContent='Preview expired';$('#preview-note').textContent='This five-minute preview has expired. Please create a new preview.';},left*1000);
  }catch(err){$('#tt').textContent='Preview expired';$('#preview-note').textContent=err.message;$('#ifr').src='about:blank';$('#ord').disabled=true;}
  return;
 }
 const m=/studio=(\w+)/.exec(location.hash);cur=m&&T.find(t=>t.id===m[1]);$('#gal').classList.toggle('h',!!cur);$('#stu').classList.toggle('h',!cur);
 if(cur){S=cur.form==='event'?SE:SW;$('#tt').textContent=cur.name;tab(1);form();$('#ord').disabled=false;$('#edit').classList.remove('h');$('#own').classList.toggle('h',!/owner/.test(location.search))}else $('#ifr').src='about:blank'
}
addEventListener('hashchange',route);$('#back').onclick=()=>location.hash='';
function tab(n){$('#pd').classList.toggle('h',n!==1);$('#pp').classList.toggle('h',n!==2);$('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2)}
async function show(){
 for(const e of S.ev)if(!e.d||!e.k){alert('Please fill the name and date of every event.');return}
 try{const payload=ad(cur)(S,false);const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY},body:JSON.stringify({action:'create-preview',template_id:cur.id,preview_payload:payload})});const out=await res.json();if(!res.ok)throw new Error(out.error||'Could not create preview');
  const u=new URL(location.href);u.hash='';u.searchParams.set('preview',out.preview_token);location.href=u.toString();
 }catch(err){alert(err.message||'Preview could not be created. Please try again.')}
}
function form(){const L=(l,a,ty='text')=>`<label>${l}<input type="${ty}" ${a}></label>`,ev=cur.form==='event';
const top=ev?`<h2>The event</h2>${L('Event title (e.g. Ali’s Birthday)','data-s="title"')}${L('Hosted by','data-s="host"')}${L('Message to guests','data-s="close"')}`:`<h2>The couple</h2><div class="r">${L('Groom','data-s="groom"')}${L('Bride','data-s="bride"')}</div>`+(cur.fam?`<div class="r">${L('Groom’s family','data-s="gf"')}${L('Bride’s family','data-s="bf"')}</div>${L('Closing message','data-s="close"')}`:'');
$('#f').innerHTML=top+S.ev.map((e,i)=>`<fieldset><legend>${ev?'Programme':'Event'} ${i+1}</legend>${L(ev?'Name (Dinner, Cake cutting, Dawat…)':'Event name (Mayun, Mehndi, Nikah, Baraat, Walima…)',`data-e="k" data-i="${i}"`)}${ev?'':L('Hosted by',`data-e="hosts" data-i="${i}"`)}<div class="r">${L('Date',`data-e="d" data-i="${i}"`,'date')}${L('Time',`data-e="t" data-i="${i}"`,'time')}</div>${L('Venue',`data-e="v" data-i="${i}"`)}${L('Address',`data-e="a" data-i="${i}"`)}<button class="o" data-rm="${i}">Remove</button></fieldset>`).join('');
$('#f').querySelectorAll('input').forEach(x=>x.value=x.dataset.s?S[x.dataset.s]:S.ev[x.dataset.i][x.dataset.e]||'')}
$('#f').oninput=e=>{const x=e.target;if(x.dataset.s)S[x.dataset.s]=x.value;else S.ev[x.dataset.i][x.dataset.e]=x.value};
$('#f').onclick=e=>{const r=e.target.dataset.rm;if(r!=null){if(S.ev.length<2)return;S.ev.splice(+r,1);form()}};
$('#add').onclick=()=>{if(S.ev.length>=10)return;S.ev.push({k:'',hosts:'',d:'',t:'',v:'',a:''});form()};
$('#show').onclick=show;$('#t1').onclick=()=>tab(1);$('#t2').onclick=show;$('#edit').onclick=()=>tab(1);
$('#ord').onclick=()=>{const ev=cur.form==='event',w=ev?`Event: ${S.title}\nHost: ${S.host}\n`:`Groom: ${S.groom}\nBride: ${S.bride}\n`+(cur.fam?`Families: ${S.gf} / ${S.bf}\n`:'');const m=`Assalamualaikum! I would like to order this invitation card.\nDesign: ${cur.name} (${tn(cur.tier)})\n${w}Programme:\n`+S.ev.map(e=>`- ${e.k}: ${fd(e.d)} ${f12(e.t)}, ${e.v}, ${e.a}`).join('\n')+`\nPreview: ${link(false)}`;open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank')};
$('#own').onclick=()=>{const u=link(true);(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('Final link copied'),()=>prompt('Final link',u))};
fetch('templates.json').then(r=>r.json()).then(j=>{OC=j.occasions;T=j.templates.map(x=>({...x,form:(OC.find(o=>o.id===x.occasion)||{}).form||'wedding'}));TR=j.tiers;grid();route()}).catch(()=>{$('#grid').innerHTML='<p class="s">Could not load templates.json. Please open this site from its web link.</p>'});
</script></body></html>
