const top=ev?`<h2>The event</h2>${L('Event title (e.g. Ali’s Birthday)','data-s="title"')}${L('Hosted by','data-s="host"')}${L('Message to guests','data-s="close"')}`:`<h2>The couple</h2><div class="r">${L('Groom','data-s="groom"')}${L('Bride','data-s="bride"')}</div>`+(cur.fam?`<div class="r">${L('Groom’s family','data-s="gf"')}${L('Bride’s family','data-s="bf"')}</div>${L('Closing message','data-s="close"')}`:'');
;const hostsUi=`<fieldset><legend>Hosts (optional)</legend>${L("Heading",'data-s="hostsTitle"')}<div id="host-list">${(S.hosts||[]).map((h,i)=>`<div class="r" style="align-items:center"><label>Name<input data-host="name" data-i="${i}" value="${String(h.name||"").replace(/"/g,"&quot;")}"></label><label>Relation<input data-host="relation" data-i="${i}" value="${String(h.relation||"").replace(/"/g,"&quot;")}"></label><button type="button" class="o" data-host-rm="${i}">×</button></div>`).join("")}</div><button type="button" class="o" id="add-host">+ Add host</button><p class="s">Shown on the last page of the card</p></fieldset>`;
$('#f').innerHTML=top+S.ev.map((e,i)=>`<fieldset><legend>${ev?'Programme':'Event'} ${i+1}</legend>${L(ev?'Name (Dinner, Cake cutting, Dawat…)':'Event name (Mayun, Mehndi, Nikah, Baraat, Walima…)',`data-e="k" data-i="${i}"`)}${ev?'':L('Hosted by',`data-e="hosts" data-i="${i}"`)}<div class="r">${L('Date',`data-e="d" data-i="${i}"`,'date')}${L('Time',`data-e="t" data-i="${i}"`,'time')}</div>${L('Venue',`data-e="v" data-i="${i}"`)}${L('Address',`data-e="a" data-i="${i}"`)}<button class="o" data-rm="${i}">Remove</button></fieldset>`).join('')+hostsUi;
$('#f').querySelectorAll('input').forEach(x=>x.value=x.dataset.s?S[x.dataset.s]:x.dataset.host?((S.hosts||[])[x.dataset.i]||{})[x.dataset.host]||'':S.ev[x.dataset.i][x.dataset.e]||'')}
$('#f').oninput=e=>{const x=e.target;if(x.dataset.s)S[x.dataset.s]=x.value;else if(x.dataset.host)(S.hosts||[])[x.dataset.i][x.dataset.host]=x.value;else S.ev[x.dataset.i][x.dataset.e]=x.value};
$('#f').onclick=e=>{if(e.target.id==='add-host'){S.hosts=S.hosts||[];S.hosts.push({name:'',relation:''});form();return}const hr=e.target.dataset.hostRm;if(hr!=null){S.hosts.splice(+hr,1);form();return}const r=e.target.dataset.rm;if(r!=null){if(S.ev.length<2)return;S.ev.splice(+r,1);form()}};
$('#add').onclick=()=>{if(S.ev.length>=10)return;S.ev.push({k:'',hosts:'',d:'',t:'',v:'',a:''});form()};
$('#show').onclick=show;$('#t1').onclick=()=>tab(1);$('#t2').onclick=show;$('#edit').onclick=()=>tab(1);
$('#ord').onclick=()=>{const ev=cur.form==='event',w=ev?`Event: ${S.title}\nHost: ${S.host}\n`:`Groom: ${S.groom}\nBride: ${S.bride}\n`+(cur.fam?`Families: ${S.gf} / ${S.bf}\n`:'');const m=`Assalamualaikum! I would like to order this invitation card.\nDesign: ${cur.name} (${tn(cur.tier)})\n${w}Programme:\n`+S.ev.map(e=>`- ${e.k}: ${fd(e.d)} ${f12(e.t)}, ${e.v}, ${e.a}`).join('\n')+`\nPreview: ${link(false)}`;open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank')};
$('#own').onclick=()=>{const u=link(true);(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('Final link copied'),()=>prompt('Final link',u))};
fetch('templates.json').then(r=>r.json()).then(j=>{OC=j.occasions;T=j.templates.map(x=>({...x,form:(OC.find(o=>o.id===x.occasion)||{}).form||'wedding'}));TR=j.tiers;grid();route()}).catch(()=>{$('#grid').innerHTML='<p class="s">Could not load templates.json. Please open this site from its web link.</p>'});
</script></body></html>
