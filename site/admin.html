<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inviteora — Admin</title><style>
body{margin:0;background:#17110d;color:#f6ead0;font:16px system-ui;padding:20px}.w{max-width:900px;margin:auto}h1,h2{color:#d2ad66}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #75664d;margin:5px 0}input{display:block;width:100%;box-sizing:border-box;background:#261f18;color:white}label{display:block;flex:1;min-width:190px;color:#d9c7a4}button{background:#d2ad66;color:#241808;cursor:pointer}button:disabled{opacity:.5}.card{border:1px solid #4a3a28;border-radius:12px;padding:14px;margin:12px 0}.muted{color:#bfae8e}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}.hide{display:none}a{color:#e5c477;overflow-wrap:anywhere}.status{white-space:pre-wrap;color:#e5c477}
</style></head><body><main class="w"><h1>Inviteora · Invitation Admin</h1><p class="muted">Owner access is restricted to the verified owner email.</p>
<section id="auth" class="card"><h2>Admin sign in / first registration</h2><input id="email" type="email" value="wajid9999@gmail.com" autocomplete="username" placeholder="Owner email"><input id="password" type="password" autocomplete="current-password" placeholder="Password (create your own)"><div class="row"><button id="signup">Create admin account</button><button id="signin">Sign in</button></div><p id="authmsg" class="status"></p></section>
<section id="dash" class="hide"><div class="row"><h2>Orders</h2><button id="refresh">Refresh</button><button id="logout">Sign out</button></div>
<section class="card"><h2>Package prices &amp; payment details</h2><p class="muted">Simple and Premium are per event. High Premium is the first-event price; each additional event uses the Premium per-event price.</p>
<div class="row"><label>Simple · Rs. per event<input id="simple-price" type="number" min="0" max="10000000" step="1"></label><label>Premium · Rs. per event<input id="premium-price" type="number" min="0" max="10000000" step="1"></label><label>High Premium · first event (Rs.)<input id="high-price" type="number" min="0" max="10000000" step="1"></label></div>
<label>JazzCash details<input id="jazzcash-details" maxlength="300"></label><label>Easypaisa details<input id="easypaisa-details" maxlength="300"></label><label>Bank transfer details<input id="bank-details" maxlength="500"></label><label>Raast details<input id="raast-details" maxlength="300"></label>
<button id="save-settings">Save prices &amp; payment details</button><p id="settings-msg" class="status"></p></section>
<p id="msg" class="status"></p><div id="orders"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script><script>if(!window.supabase||!window.supabase.createClient){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"><\/script>')}</script><script>
const URL='https://pvunxonsskcczghqivpl.supabase.co',KEY='sb_publishable_Nbb-PCKF_qxYCfvMwX8b9w_MttixP9P',API=URL+'/functions/v1/invitations-api',OWNER='wajid9999@gmail.com';
const authmsg=document.getElementById('authmsg');if(!window.supabase||typeof window.supabase.createClient!=='function'){authmsg.textContent='Admin connection library did not load. Check internet access, then reload this page.';document.getElementById('signup').disabled=true;document.getElementById('signin').disabled=true;throw new Error('Supabase client library unavailable');}const sb=window.supabase.createClient(URL,KEY);authmsg.textContent='Connection ready. You can create your admin account or sign in.';
const $=id=>document.getElementById(id);
async function api(body){const {data:{session}}=await sb.auth.getSession();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+(session?.access_token||'')},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function bootstrap(){const {data:{session}}=await sb.auth.getSession();if(!session)return; if((session.user.email||'').toLowerCase()!==OWNER)throw new Error('This account is not the owner email.');await api({action:'admin-bootstrap'});$('auth').classList.add('hide');$('dash').classList.remove('hide');await loadSettings();await load()}
$('signup').onclick=async()=>{const b=$('signup');b.disabled=true;$('authmsg').textContent='Connecting and creating your account…';try{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!==OWNER)throw new Error('Use the registered owner email.');if(password.length<8)throw new Error('Use a password with at least 8 characters.');const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;if(data.session){await bootstrap()}else $('authmsg').textContent='Registration request accepted. Check your email inbox and Spam folder for the verification link.'}catch(e){$('authmsg').textContent='Registration failed: '+(e.message||'Unknown error')}finally{b.disabled=false}};
$('signin').onclick=async()=>{const b=$('signin');b.disabled=true;$('authmsg').textContent='Signing in…';try{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await bootstrap()}catch(e){$('authmsg').textContent='Sign in failed: '+(e.message||'Unknown error')}finally{b.disabled=false}};
async function loadSettings(){try{const j=await api({action:'public-settings'}),v=j.settings||{};$('simple-price').value=v.simple_price??0;$('premium-price').value=v.premium_price??0;$('high-price').value=v.high_price??0;$('jazzcash-details').value=v.jazzcash_details||'';$('easypaisa-details').value=v.easypaisa_details||'';$('bank-details').value=v.bank_details||'';$('raast-details').value=v.raast_details||'';$('settings-msg').textContent='Current package prices and payment instructions loaded.'}catch(e){$('settings-msg').textContent=e.message}}
$('save-settings').onclick=async()=>{const n=id=>Number($(id).value);for(const id of ['simple-price','premium-price','high-price'])if(!Number.isInteger(n(id))||n(id)<0||n(id)>10000000){$('settings-msg').textContent='Enter whole-number prices from Rs. 0 to Rs. 10,000,000.';return}const settings={simple_price:n('simple-price'),premium_price:n('premium-price'),high_price:n('high-price'),jazzcash_details:$('jazzcash-details').value,easypaisa_details:$('easypaisa-details').value,bank_details:$('bank-details').value,raast_details:$('raast-details').value};const b=$('save-settings');b.disabled=true;$('settings-msg').textContent='Saving…';try{await api({action:'admin-settings-save',settings});$('settings-msg').textContent='Prices and payment details saved.'}catch(e){$('settings-msg').textContent=e.message}finally{b.disabled=false}};
async function load(){try{const j=await api({action:'admin-list'});$('msg').textContent='Loaded '+j.orders.length+' orders.';$('orders').innerHTML=j.orders.length?j.orders.map(o=>'<article class="card"><h3>Order #'+o.order_number+' · Rs. '+Number(o.amount_pkr).toLocaleString('en-PK')+'</h3><p>'+esc(o.customer_name)+' · '+esc(o.customer_phone)+'</p><p>'+esc(o.template_name)+' · '+esc(o.package_tier)+' · '+esc(o.event_count||1)+' event(s) · <b>'+esc(o.status)+'</b></p><p class="muted">Created: '+new Date(o.created_at).toLocaleString()+'</p>'+(o.payment_proof_url?'<p><b>Payment screenshot</b></p><a href="'+esc(o.payment_proof_url)+'" target="_blank" rel="noopener"><img src="'+esc(o.payment_proof_url)+'" alt="Payment proof for order '+o.order_number+'" style="display:block;width:min(100%,420px);max-height:560px;object-fit:contain;border:1px solid #75664d;border-radius:10px"></a><p class="muted">Uploaded: '+(o.payment_submitted_at?new Date(o.payment_submitted_at).toLocaleString():'')+'</p>':'<p class="muted">Payment screenshot not uploaded yet.</p>')+(o.status==='pending_approval'&&o.payment_proof_url?'<button data-approve="'+o.id+'">Payment OK — generate original link</button>':o.status==='pending_payment'?'<p class="muted">Waiting for customer payment screenshot.</p>':'')+'</article>').join(''):'<p class="muted">No orders yet.</p>'}catch(e){$('msg').textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('orders').onclick=async e=>{const b=e.target.closest('[data-approve]');if(!b)return;if(!confirm('Confirm payment has been received and verified?'))return;b.disabled=true;try{const j=await api({action:'admin-approve',order_id:b.dataset.approve});const original=location.origin+location.pathname.replace(/admin\.html$/,'')+'?original='+encodeURIComponent(j.original_token);const msg='Your invitation order #'+j.order.order_number+' is approved. Here is your original invitation link (valid through event date): '+original;const wa='https://wa.me/'+String(j.order.customer_phone).replace(/\D/g,'')+'?text='+encodeURIComponent(msg);$('msg').innerHTML='Approved. Original link: <a target="_blank" rel="noopener" href="'+original+'">Open original invitation</a> · <a target="_blank" rel="noopener" href="'+wa+'">Send link on WhatsApp</a>';await load()}catch(e){$('msg').textContent=e.message;b.disabled=false}};
$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(async({data})=>{if(data.session)try{await bootstrap()}catch(e){$('authmsg').textContent=e.message}});
</script></body></html>
